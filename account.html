<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — PromptHub</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b1020"><link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#0b1020;--panel:#11182a;--panel2:#151f35;--line:#26324b;--text:#f4f7fb;--muted:#94a3b8;--accent:#7c8cff;--accent2:#5eead4}
*{box-sizing:border-box}body{margin:0;background:var(--bg)!important;color:var(--text)!important;font-family:Manrope,Arial,sans-serif!important}.nav{background:rgba(11,16,32,.92)!important;border-bottom:1px solid var(--line)!important;padding:16px 20px;backdrop-filter:blur(12px)}.nav-inner{max-width:980px;margin:auto;display:flex;align-items:center;justify-content:space-between}.logo{font-family:Fraunces,Georgia,serif!important;font-size:22px;font-weight:700;text-decoration:none;color:#fff!important}.back{color:var(--muted)!important;text-decoration:none;font-size:14px}.container{max-width:980px;margin:28px auto;padding:0 16px}.card{background:var(--panel)!important;border:1px solid var(--line)!important;border-radius:22px!important;box-shadow:0 18px 45px rgba(0,0,0,.18)!important;color:var(--text)!important}.narrow{max-width:460px;margin:30px auto;padding:24px}.profile-head{overflow:hidden;border-radius:24px;background:var(--panel)!important;border:1px solid var(--line)!important;box-shadow:0 18px 45px rgba(0,0,0,.2)!important}.cover{height:260px;background:linear-gradient(135deg,#151f35,#25345b);background-size:cover;background-position:center}.profile-body{padding:0 30px 30px;margin-top:-58px;position:relative}.profile-meta{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.avatar{width:120px;height:120px;border-radius:50%;object-fit:cover;background:#182238;border:5px solid var(--panel);display:block}.name{font-family:Fraunces,Georgia,serif!important;font-size:32px!important;margin:12px 0 3px!important;color:#fff!important}.username{color:var(--muted);margin:0 0 16px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line)!important;border-radius:12px!important;padding:11px 17px;background:#1a2540!important;color:#fff!important;font-weight:700;cursor:pointer;font-family:inherit}.btn.primary{background:var(--accent)!important;color:#07101f!important;border-color:transparent!important}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.about{padding:26px;margin-top:16px}.about h2{margin:0 0 8px;font-family:Fraunces,Georgia,serif!important}.bio{color:#cbd5e1;line-height:1.65;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{background:var(--panel2)!important;border:1px solid var(--line)!important;border-radius:14px;padding:14px}.field b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px}.field span{color:#e5e7eb;word-break:break-word}.msg{min-height:20px;margin-top:10px;font-size:14px}.ok{color:var(--accent2)!important}.err{color:#fb7185!important}.edit-panel{padding:26px;margin-top:16px}.edit-panel[hidden]{display:none!important}.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.edit-panel label{display:block;color:var(--muted)!important;font-size:12px!important;margin-bottom:4px}.edit-panel input,.edit-panel textarea{width:100%;padding:12px 13px;border:1px solid var(--line)!important;border-radius:12px!important;margin:0 0 12px;font-size:15px;font-family:inherit;background:var(--panel2)!important;color:var(--text)!important}.edit-panel textarea{min-height:100px;resize:vertical}.upload-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}.media-control{border:1px dashed var(--line);border-radius:16px;padding:12px;background:rgba(21,31,53,.55)}.media-control img{width:100%;height:120px;object-fit:cover;border-radius:11px;background:#182238;display:block;margin-bottom:10px}.file-label{display:inline-block;padding:9px 12px;background:#1a2540;border:1px solid var(--line);color:#e5e7eb;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer}.seg{display:flex;gap:7px;margin:18px 0}.seg button{flex:1;border:1px solid var(--line)!important;background:transparent!important;color:var(--muted)!important;border-radius:10px!important;padding:10px;font-weight:700;cursor:pointer}.seg button.on{background:#1a2540!important;color:#fff!important;border-color:#405071!important}.muted{color:var(--muted)!important}input:focus,textarea:focus{outline:2px solid rgba(124,140,255,.55);outline-offset:1px}.status{padding:24px}.close{float:right;background:transparent!important;border:0!important;color:var(--muted)!important;font-size:24px;cursor:pointer}.auth-card{padding:28px}.auth-card h1{font-family:Fraunces,Georgia,serif!important}.auth-card input{width:100%;padding:12px;border:1px solid var(--line)!important;border-radius:12px;margin:6px 0 14px;background:var(--panel2)!important;color:var(--text)!important}.auth-card .btn{width:100%;margin-top:4px}@media(max-width:650px){.grid,.edit-grid,.upload-row{grid-template-columns:1fr}.profile-meta{align-items:flex-start;flex-direction:column}.cover{height:190px}.profile-body{padding:0 18px 22px}.container{margin-top:18px}.actions{width:100%}.actions .btn{flex:1}.name{font-size:28px!important}}
</style></head>
<body>
<nav class="nav"><div class="nav-inner"><a class="logo" href="index.html">Prompt<span>Hub</span></a><a class="back" href="index.html">← Home</a></div></nav>
<main class="container">
<div class="card status" id="status">Loading…</div>
<section class="card narrow auth-card" id="authView" hidden>
<h1>My Profile</h1><p class="muted">Login to manage your personal profile.</p>
<div class="seg"><button id="tabLogin" class="on" type="button">Login</button><button id="tabSignup" type="button">Sign up</button></div>
<button class="btn" id="googleBtn" type="button">Continue with Google</button>
<div id="loginBox"><form id="loginForm"><label class="muted">Email</label><input id="lEmail" type="email" required autocomplete="email"><label class="muted">Password</label><input id="lPass" type="password" required autocomplete="current-password"><button class="btn primary">Login</button></form><button class="btn" id="forgot" style="margin-top:10px;background:transparent!important;color:var(--muted)!important;border:0!important" type="button">Forgot password?</button></div>
<div id="signupBox" hidden><form id="signupForm"><label class="muted">Full name</label><input id="sName" maxlength="120" required autocomplete="name"><label class="muted">Email</label><input id="sEmail" type="email" required autocomplete="email"><label class="muted">Password (min. 8 characters)</label><input id="sPass" type="password" minlength="8" required autocomplete="new-password"><button class="btn primary">Create account</button></form></div>
<div id="authMsg" class="msg"></div></section>

<section id="profileView" hidden>
<div class="profile-head">
<div id="cover" class="cover"></div>
<div class="profile-body"><div class="profile-meta"><div><img id="avatar" class="avatar" alt="Profile picture"><h1 id="displayName" class="name">Your Name</h1><p id="displayUsername" class="username">@username</p></div><div class="actions"><button class="btn" id="logout" type="button">Logout</button><button class="btn primary" id="editBtn" type="button">Edit profile</button></div></div></div></div>
<div class="card about"><h2>About</h2><p id="displayBio" class="bio">Tell people about yourself.</p><div class="grid"><div class="field"><b>Country</b><span id="displayCountry">—</span></div><div class="field"><b>City</b><span id="displayCity">—</span></div><div class="field"><b>Phone</b><span id="displayPhone">—</span></div><div class="field"><b>Website</b><span id="displayWebsite">—</span></div><div class="field"><b>Occupation</b><span id="displayOccupation">—</span></div><div class="field"><b>Education</b><span id="displayEducation">—</span></div></div></div>

<div class="card edit-panel" id="editPanel" hidden><button class="close" id="closeEdit" type="button">×</button><h2>Edit profile</h2><p class="muted">Update your information and photos.</p>
<div class="upload-row"><div class="media-control"><img id="avatarPreview" alt="Profile preview"><label class="file-label" for="avatarFile">Change profile picture</label><input id="avatarFile" type="file" accept="image/*" hidden></div><div class="media-control"><img id="coverPreview" alt="Cover preview"><label class="file-label" for="coverFile">Change cover picture</label><input id="coverFile" type="file" accept="image/*" hidden></div></div>
<label>Full name</label><input id="profileName" maxlength="120"><label>Username</label><input id="profileUsername" maxlength="32" placeholder="yourusername"><label>About / Bio</label><textarea id="profileBio" maxlength="1000"></textarea><div class="edit-grid"><div><label>Country</label><input id="profileCountry" maxlength="80"></div><div><label>City</label><input id="profileCity" maxlength="80"></div><div><label>Phone number</label><input id="profilePhone" maxlength="40"></div><div><label>Website</label><input id="profileWebsite" maxlength="300" placeholder="https://..."></div><div><label>Occupation</label><input id="profileOccupation" maxlength="120"></div><div><label>Education</label><input id="profileEducation" maxlength="160"></div></div><button class="btn primary" id="saveProfile" type="button">Save profile</button><div id="profileMsg" class="msg"></div></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/common.js"></script>
<script>
(function(){'use strict';var PH=window.PH,db=PH.db,$=id=>document.getElementById(id),me=null;
var DEF_AV='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23182238"/><circle cx="50" cy="38" r="18" fill="%2394a3b8"/><path d="M15 92c6-22 24-34 35-34s29 12 35 34" fill="%2394a3b8"/></svg>';
var DEF_CV='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="%23151f35"/><stop offset="1" stop-color="%232c3f70"/></linearGradient></defs><rect width="600" height="180" fill="url(%23g)"/></svg>';
function msg(text,kind){$('profileMsg').textContent=text||'';$('profileMsg').className='msg '+(kind||'')}
function authMsg(text,kind){$('authMsg').textContent=text||'';$('authMsg').className='msg '+(kind||'')}
function showAuth(){ $('status').hidden=true;$('authView').hidden=false;$('profileView').hidden=true }
function showProfile(){ $('status').hidden=true;$('authView').hidden=true;$('profileView').hidden=false }
function fill(p){p=p||{};$('profileName').value=p.full_name||'';$('profileUsername').value=p.username||'';$('profileBio').value=p.bio||'';$('profileCountry').value=p.country||'';$('profileCity').value=p.city||'';$('profilePhone').value=p.phone_number||'';$('profileWebsite').value=p.website_url||'';$('profileOccupation').value=p.occupation||'';$('profileEducation').value=p.education||'';$('avatar').src=p.avatar_url||DEF_AV;$('avatarPreview').src=p.avatar_url||DEF_AV;$('cover').style.backgroundImage='url("'+(p.cover_url||DEF_CV)+'")';$('coverPreview').src=p.cover_url||DEF_CV;$('displayName').textContent=p.full_name||'Your Name';$('displayUsername').textContent='@'+(p.username||'username');$('displayBio').textContent=p.bio||'Tell people about yourself.';$('displayCountry').textContent=p.country||'—';$('displayCity').textContent=p.city||'—';$('displayPhone').textContent=p.phone_number||'—';$('displayWebsite').textContent=p.website_url||'—';$('displayOccupation').textContent=p.occupation||'—';$('displayEducation').textContent=p.education||'—'}
async function load(){var s=await db.auth.getSession();if(s.error){$('status').textContent=s.error.message;return}if(s.data.session){enter(s.data.session.user)}else showAuth();db.auth.onAuthStateChange(function(_e,session){if(session)enter(session.user);else showAuth()})}
async function enter(user){me=user;showProfile();var r=await db.from('profiles').select('full_name,username,avatar_url,cover_url,bio,website_url,country,city,phone_number,occupation,education').eq('id',user.id).maybeSingle();if(!r.data){var ins=await db.from('profiles').insert({id:user.id,full_name:user.user_metadata?.full_name||user.user_metadata?.name||'',username:'user_'+user.id.slice(0,8)}).select().single();if(ins.error){msg(ins.error.message,'err');return}r={data:ins.data}}fill(r.data)}
$('tabLogin').onclick=function(){$('tabLogin').classList.add('on');$('tabSignup').classList.remove('on');$('loginBox').hidden=false;$('signupBox').hidden=true;authMsg('')};$('tabSignup').onclick=function(){$('tabSignup').classList.add('on');$('tabLogin').classList.remove('on');$('loginBox').hidden=true;$('signupBox').hidden=false;authMsg('')};
$('googleBtn').onclick=async function(){var r=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});if(r.error)authMsg(r.error.message,'err')};
$('loginForm').onsubmit=async function(e){e.preventDefault();var r=await db.auth.signInWithPassword({email:$('lEmail').value,password:$('lPass').value});if(r.error)authMsg(r.error.message,'err');else authMsg('Logged in ✓','ok')};
$('signupForm').onsubmit=async function(e){e.preventDefault();var r=await db.auth.signUp({email:$('sEmail').value,password:$('sPass').value,options:{data:{full_name:$('sName').value.trim()}}});if(r.error)authMsg(r.error.message,'err');else authMsg('Account created. Check your email if verification is enabled.','ok')};
$('forgot').onclick=async function(){var email=$('lEmail').value.trim();if(!email){authMsg('Enter your email first.','err');return}var r=await db.auth.resetPasswordForEmail(email,{redirectTo:location.href});authMsg(r.error?r.error.message:'Password reset email sent.',r.error?'err':'ok')};
function openEdit(){ $('editPanel').hidden=false;$('editBtn').textContent='Close edit';$('editBtn').classList.remove('primary');$('editPanel').scrollIntoView({behavior:'smooth',block:'start'}) }
function closeEdit(){ $('editPanel').hidden=true;$('editBtn').textContent='Edit profile';$('editBtn').classList.add('primary') }
$('editBtn').onclick=function(){if($('editPanel').hidden)openEdit();else closeEdit()};$('closeEdit').onclick=closeEdit;
async function save(){var upd={full_name:$('profileName').value.trim(),username:$('profileUsername').value.trim()||null,bio:$('profileBio').value.trim(),country:$('profileCountry').value.trim(),city:$('profileCity').value.trim(),phone_number:$('profilePhone').value.trim(),website_url:$('profileWebsite').value.trim(),occupation:$('profileOccupation').value.trim(),education:$('profileEducation').value.trim()};var r=await db.from('profiles').update(upd).eq('id',me.id);if(r.error){msg(r.error.message,'err');return}fill(Object.assign({},upd,{avatar_url:$('avatar').src,cover_url:$('coverPreview').src}));msg('Profile saved ✓','ok');setTimeout(closeEdit,500)}
$('saveProfile').onclick=save;$('logout').onclick=async function(){await db.auth.signOut();showAuth()};
async function upload(file,kind){if(!file)return;if(file.size>5*1024*1024){msg('Image must be under 5MB','err');return}var ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';var path='avatars/'+me.id+'/'+kind+'-'+Date.now()+'.'+ext;msg('Uploading...','');var up=await db.storage.from('product-media').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type||undefined});if(up.error){msg('Upload failed: '+up.error.message,'err');return}var url=db.storage.from('product-media').getPublicUrl(path).data.publicUrl;var field=kind==='avatar'?'avatar_url':'cover_url',obj={};obj[field]=url;var r=await db.from('profiles').update(obj).eq('id',me.id);if(r.error){msg(r.error.message,'err');return}if(kind==='avatar'){$('avatar').src=url;$('avatarPreview').src=url}else{$('cover').style.backgroundImage='url("'+url+'")';$('coverPreview').src=url}msg((kind==='avatar'?'Profile picture':'Cover picture')+' updated ✓','ok')}
$('avatarFile').onchange=e=>{upload(e.target.files[0],'avatar');e.target.value=''};$('coverFile').onchange=e=>{upload(e.target.files[0],'cover');e.target.value=''};
load();
})();
</script></body></html>
