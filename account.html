<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — PromptHub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#f7f7fb;color:#17171c;line-height:1.5}
a{text-decoration:none;color:inherit}.nav{background:#fff;border-bottom:1px solid #e9e9ef}.nav-inner{max-width:950px;margin:auto;padding:16px 20px;display:flex;align-items:center}.logo{font-size:22px;font-weight:800;margin-right:auto}.logo span{font-weight:400}.wrap{max-width:650px;margin:45px auto;padding:0 20px}.box{background:#fff;border:1px solid #e7e7ed;border-radius:20px;padding:28px;margin-bottom:18px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tab{border:1px solid #ddd;border-radius:9px;padding:10px 15px;background:#fff;cursor:pointer}.tab.active{background:#17171c;color:#fff}.field{margin:12px 0}.field label{display:block;font-size:13px;margin-bottom:6px;color:#555}.field input{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font:inherit}.btn{border:0;border-radius:10px;padding:11px 17px;background:#17171c;color:#fff;font-weight:700;cursor:pointer}.muted{color:#666;font-size:14px}.notice{background:#fff;border:1px dashed #d5d5df;border-radius:15px;padding:22px;text-align:center;color:#555}.error{color:#a22}.ok{color:#175c2a}.row{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<nav class="nav"><div class="nav-inner"><a class="logo" href="index.html">Prompt<span>Hub</span></a></div></nav>
<main class="wrap">
<a href="index.html" class="muted">← Back to Store</a>
<div id="status" class="notice" style="margin-top:18px">Loading account…</div>
<section id="authBox" class="box" hidden>
<div class="tabs"><button class="tab active" id="loginTab">Login</button><button class="tab" id="signupTab">Sign up</button></div>
<form id="loginForm">
<div class="field"><label>Email</label><input id="loginEmail" type="email" required></div>
<div class="field"><label>Password</label><input id="loginPassword" type="password" required></div>
<button class="btn" type="submit">Login</button>
</form>
<form id="signupForm" hidden>
<div class="field"><label>Full name</label><input id="name" type="text"></div>
<div class="field"><label>Email</label><input id="signupEmail" type="email" required></div>
<div class="field"><label>Password (min. 8 characters)</label><input id="signupPassword" type="password" minlength="8" required></div>
<button class="btn" type="submit">Create account</button>
</form>
<p id="msg" class="muted" style="margin-top:15px"></p>
</section>
<section id="userBox" class="box" hidden>
<h2>My Account</h2>
<p id="userEmail" class="muted" style="margin:8px 0 20px"></p>
<div class="row"><button class="btn" id="logout">Logout</button><a class="btn" href="index.html">Explore prompts</a></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
var URL='https://bwtblyvnsiguhopmxggi.supabase.co', KEY='sb_publishable_BKBleSWgGlggg-MPaBBBcg_zTObBTW8';
var status=document.getElementById('status'), auth=document.getElementById('authBox'), userBox=document.getElementById('userBox'), msg=document.getElementById('msg');
var client=null;
function message(t,cls){msg.textContent=t;msg.className=cls||'muted'}
function showAuth(){status.hidden=true;auth.hidden=false;userBox.hidden=true}
function showUser(u){status.hidden=true;auth.hidden=true;userBox.hidden=false;document.getElementById('userEmail').textContent=u.email||''}
function init(){
 if(!window.supabase){status.innerHTML='<strong>Account system could not load.</strong><div style="margin-top:7px">Please refresh the page and try again.</div>';return}
 client=window.supabase.createClient(URL,KEY);
 client.auth.getSession().then(function(res){if(res.data.session)showUser(res.data.session.user);else showAuth()}).catch(function(e){status.innerHTML='<strong>Account error.</strong><div>'+String(e.message||e)+'</div>'});
 client.auth.onAuthStateChange(function(event,session){if(session)showUser(session.user);else showAuth()});
}
document.getElementById('loginTab').onclick=function(){this.classList.add('active');document.getElementById('signupTab').classList.remove('active');document.getElementById('loginForm').hidden=false;document.getElementById('signupForm').hidden=true;message('')};
document.getElementById('signupTab').onclick=function(){this.classList.add('active');document.getElementById('loginTab').classList.remove('active');document.getElementById('loginForm').hidden=true;document.getElementById('signupForm').hidden=false;message('')};
document.getElementById('loginForm').onsubmit=async function(e){e.preventDefault();message('Signing in…');var r=await client.auth.signInWithPassword({email:document.getElementById('loginEmail').value.trim(),password:document.getElementById('loginPassword').value});if(r.error)message(r.error.message,'error');else message('Logged in.','ok')};
document.getElementById('signupForm').onsubmit=async function(e){e.preventDefault();message('Creating account…');var email=document.getElementById('signupEmail').value.trim(),password=document.getElementById('signupPassword').value,name=document.getElementById('name').value.trim();var r=await client.auth.signUp({email:email,password:password,options:{data:{full_name:name}}});if(r.error)message(r.error.message,'error');else message(r.data.session?'Account created.':'Account created. Check your email if confirmation is enabled.','ok')};
document.getElementById('logout').onclick=async function(){await client.auth.signOut()};
init();
})();
</script>
</body>
</html>
