<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Profile — PromptHub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#f5f6f7;--card:#fff;--soft:#fafafa;--line:#e6e7e9;--text:#17191c;--muted:#747a82;--shadow:0 5px 22px rgba(20,25,30,.055)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg)!important;color:var(--text)!important;font-family:Arial,Helvetica,sans-serif!important}a{color:inherit;text-decoration:none}
.nav{background:#fff!important;border-bottom:1px solid var(--line)!important;height:62px;padding:0 18px}.nav-inner{max-width:1000px;margin:auto;height:100%;display:flex;align-items:center;justify-content:space-between}.logo{font-size:20px;font-weight:700;color:var(--text)!important}.back{font-size:14px;color:var(--muted)!important}
.container{max-width:900px;margin:24px auto;padding:0 14px}.card{background:#fff!important;border:1px solid var(--line)!important;border-radius:18px!important;box-shadow:var(--shadow)!important;color:var(--text)!important}.status{padding:22px}.narrow{max-width:450px;margin:28px auto;padding:24px}
.profile-card{overflow:hidden}.cover{height:245px;background:#eceeef center/cover no-repeat}.profile-body{padding:0 26px 25px}.profile-top{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-top:-48px}.avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;background:#eee;border:5px solid #fff;box-shadow:0 3px 12px rgba(0,0,0,.08);display:block}.name{font-size:28px!important;margin:12px 0 2px!important;color:var(--text)!important;font-weight:700!important}.username{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;margin-bottom:2px}.btn{appearance:none;border:1px solid #dedfe1!important;background:#fff!important;color:#25282c!important;border-radius:10px!important;padding:10px 15px!important;font-weight:700!important;cursor:pointer;box-shadow:none!important}.btn:hover{background:#f5f5f5!important}.btn.primary{background:#17191c!important;color:#fff!important;border-color:#17191c!important}.btn.primary:hover{background:#303236!important}
.about{padding:24px;margin-top:16px}.about h2{font-size:22px!important;margin:0 0 6px;color:var(--text)!important}.bio{margin:0 0 18px;color:var(--muted);line-height:1.55}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{background:var(--soft)!important;border:1px solid #eeeeef!important;border-radius:13px;padding:14px;text-align:left;cursor:pointer;color:var(--text)!important}.field:hover{background:#f6f6f6!important}.field b{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#8a9097;margin-bottom:5px}.field span{display:block;word-break:break-word;color:#282c31;font-size:14px}
.edit-modal[hidden]{display:none!important}.edit-modal{position:fixed;inset:0;background:rgba(20,22,25,.28);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}.edit-box{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 60px rgba(20,25,30,.16);padding:24px}.edit-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.edit-head h2{margin:0;font-size:22px}.close{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#555;cursor:pointer;font-size:20px}.muted{color:var(--muted)!important}.edit-box label{display:block;color:#666d75!important;font-size:12px!important;margin:0 0 5px}.edit-box input,.edit-box textarea{width:100%;padding:12px 13px;border:1px solid #dedfe2!important;border-radius:10px!important;background:#fff!important;color:var(--text)!important;margin:0 0 13px;font:inherit}.edit-box textarea{min-height:100px;resize:vertical}.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.upload-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.media{border:1px solid var(--line);background:#fafafa;border-radius:13px;padding:9px}.media img{width:100%;height:120px;object-fit:cover;border-radius:9px;background:#eee;display:block;margin-bottom:8px}.file-label{display:block;text-align:center;padding:9px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer}.msg{min-height:20px;margin-top:10px;font-size:13px}.ok{color:#4b5563!important}.err{color:#b42318!important}
.auth-card{padding:26px}.auth-card h1{margin-top:0}.auth-card input{width:100%;padding:12px;border:1px solid var(--line)!important;border-radius:10px;margin:6px 0 14px;background:#fff!important;color:var(--text)!important}.auth-card .btn{width:100%;margin-top:4px}.seg{display:flex;gap:6px;margin:16px 0}.seg button{flex:1;border:1px solid var(--line)!important;background:#fff!important;color:#777!important;border-radius:9px!important;padding:10px;font-weight:700}.seg button.on{background:#f0f0f0!important;color:#222!important}.ok,.msg.ok{color:#555!important}
@media(max-width:650px){.container{margin-top:14px}.cover{height:190px}.profile-body{padding:0 16px 20px}.profile-top{align-items:flex-start;flex-direction:column;margin-top:-46px}.actions{width:100%;margin-top:0}.actions .btn{flex:1}.name{font-size:25px!important}.grid,.edit-grid,.upload-row{grid-template-columns:1fr}.about{padding:18px}.edit-modal{padding:10px}.edit-box{padding:18px;max-height:95vh}}
</style>
</head>
<body>
<nav class="nav"><div class="nav-inner"><a class="logo" href="index.html">Prompt<span>Hub</span></a><a class="back" href="index.html">Home</a></div></nav>
<main class="container">
<div class="card status" id="status">Loading…</div>
<section class="card narrow auth-card" id="authView" hidden>
<h1>My Profile</h1><p class="muted">Login to manage your personal profile.</p>
<div class="seg"><button id="tabLogin" class="on" type="button">Login</button><button id="tabSignup" type="button">Sign up</button></div>
<button class="btn" id="googleBtn" type="button">Continue with Google</button>
<div id="loginBox"><form id="loginForm"><label>Email</label><input id="lEmail" type="email" required autocomplete="email"><label>Password</label><input id="lPass" type="password" required autocomplete="current-password"><button class="btn primary">Login</button></form><button class="btn" id="forgot" style="margin-top:10px;border:0!important;background:transparent!important;color:var(--muted)!important" type="button">Forgot password?</button></div>
<div id="signupBox" hidden><form id="signupForm"><label>Full name</label><input id="sName" maxlength="120" required autocomplete="name"><label>Email</label><input id="sEmail" type="email" required autocomplete="email"><label>Password (min. 8 characters)</label><input id="sPass" type="password" minlength="8" required autocomplete="new-password"><button class="btn primary">Create account</button></form></div>
<div id="authMsg" class="msg"></div></section>
<section id="profileView" hidden>
<div class="card profile-card">
<div id="cover" class="cover"></div>
<div class="profile-body"><div class="profile-top"><div><img id="avatar" class="avatar" alt="Profile picture"><h1 id="displayName" class="name">Your Name</h1><p id="displayUsername" class="username">@username</p></div><div class="actions"><button class="btn primary" id="editBtn" type="button">Edit profile</button><button class="btn" id="logout" type="button">Logout</button></div></div></div>
</div>
<div class="card about"><h2>About</h2><p id="displayBio" class="bio">Tell people about yourself.</p><div class="grid">
<button class="field" data-edit="profileCountry" type="button"><b>Country</b><span id="displayCountry">—</span></button>
<button class="field" data-edit="profileCity" type="button"><b>City</b><span id="displayCity">—</span></button>
<button class="field" data-edit="profilePhone" type="button"><b>Phone</b><span id="displayPhone">—</span></button>
<button class="field" data-edit="profileWebsite" type="button"><b>Website</b><span id="displayWebsite">—</span></button>
<button class="field" data-edit="profileOccupation" type="button"><b>Occupation</b><span id="displayOccupation">—</span></button>
<button class="field" data-edit="profileEducation" type="button"><b>Education</b><span id="displayEducation">—</span></button>
</div></div>
</section></main>

<div class="edit-modal" id="editModal" hidden><div class="edit-box">
<div class="edit-head"><div><h2>Edit profile</h2><p class="muted" style="margin:5px 0 0">Update your information and photos.</p></div><button class="close" id="closeEdit" type="button">×</button></div>
<div class="upload-row"><div class="media"><img id="avatarPreview" alt="Profile preview"><label class="file-label" for="avatarFile">Change profile picture</label><input id="avatarFile" type="file" accept="image/*" hidden></div><div class="media"><img id="coverPreview" alt="Cover preview"><label class="file-label" for="coverFile">Change cover picture</label><input id="coverFile" type="file" accept="image/*" hidden></div></div>
<label>Full name</label><input id="profileName" maxlength="120"><label>Username</label><input id="profileUsername" maxlength="32" placeholder="yourusername"><label>About / Bio</label><textarea id="profileBio" maxlength="1000"></textarea>
<div class="edit-grid"><div><label>Country</label><input id="profileCountry" maxlength="80"></div><div><label>City</label><input id="profileCity" maxlength="80"></div><div><label>Phone number</label><input id="profilePhone" maxlength="40"></div><div><label>Website</label><input id="profileWebsite" maxlength="300" placeholder="https://..."></div><div><label>Occupation</label><input id="profileOccupation" maxlength="120"></div><div><label>Education</label><input id="profileEducation" maxlength="160"></div></div>
<button class="btn primary" id="saveProfile" type="button">Save profile</button><div id="profileMsg" class="msg"></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/common.js"></script>
<script>
(function(){'use strict';var PH=window.PH,db=PH.db,$=id=>document.getElementById(id),me=null;
var DEF_AV='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23eeeeee"/><circle cx="50" cy="38" r="18" fill="%23999999"/><path d="M15 92c6-22 24-34 35-34s29 12 35 34" fill="%23999999"/></svg>';
var DEF_CV='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180"><rect width="600" height="180" fill="%23e9eaec"/></svg>';
function msg(text,kind){$('profileMsg').textContent=text||'';$('profileMsg').className='msg '+(kind||'')}
function authMsg(text,kind){$('authMsg').textContent=text||'';$('authMsg').className='msg '+(kind||'')}
function showAuth(){$('status').hidden=true;$('authView').hidden=false;$('profileView').hidden=true;$('editModal').hidden=true}
function showProfile(){$('status').hidden=true;$('authView').hidden=true;$('profileView').hidden=false}
function fill(p){p=p||{};$('profileName').value=p.full_name||'';$('profileUsername').value=p.username||'';$('profileBio').value=p.bio||'';$('profileCountry').value=p.country||'';$('profileCity').value=p.city||'';$('profilePhone').value=p.phone_number||'';$('profileWebsite').value=p.website_url||'';$('profileOccupation').value=p.occupation||'';$('profileEducation').value=p.education||'';$('avatar').src=p.avatar_url||DEF_AV;$('avatarPreview').src=p.avatar_url||DEF_AV;$('cover').style.backgroundImage='url("'+(p.cover_url||DEF_CV)+'")';$('coverPreview').src=p.cover_url||DEF_CV;$('displayName').textContent=p.full_name||'Your Name';$('displayUsername').textContent='@'+(p.username||'username');$('displayBio').textContent=p.bio||'Tell people about yourself.';$('displayCountry').textContent=p.country||'—';$('displayCity').textContent=p.city||'—';$('displayPhone').textContent=p.phone_number||'—';$('displayWebsite').textContent=p.website_url||'—';$('displayOccupation').textContent=p.occupation||'—';$('displayEducation').textContent=p.education||'—'}
async function load(){var s=await db.auth.getSession();if(s.error){$('status').textContent=s.error.message;return}if(s.data.session)enter(s.data.session.user);else showAuth();db.auth.onAuthStateChange(function(_e,session){if(session)enter(session.user);else showAuth()})}
async function enter(user){me=user;showProfile();var r=await db.from('profiles').select('full_name,username,avatar_url,cover_url,bio,website_url,country,city,phone_number,occupation,education').eq('id',user.id).maybeSingle();if(r.error){$('status').textContent='Profile data could not be loaded: '+r.error.message;return}if(!r.data){var ins=await db.from('profiles').insert({id:user.id,full_name:user.user_metadata?.full_name||user.user_metadata?.name||'',username:'user_'+user.id.slice(0,8)}).select().single();if(ins.error){$('status').textContent=ins.error.message;return}r={data:ins.data}}fill(r.data)}
$('tabLogin').onclick=function(){$('tabLogin').classList.add('on');$('tabSignup').classList.remove('on');$('loginBox').hidden=false;$('signupBox').hidden=true;authMsg('')};$('tabSignup').onclick=function(){$('tabSignup').classList.add('on');$('tabLogin').classList.remove('on');$('loginBox').hidden=true;$('signupBox').hidden=false;authMsg('')};
$('googleBtn').onclick=async function(){var r=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});if(r.error)authMsg(r.error.message,'err')};
$('loginForm').onsubmit=async function(e){e.preventDefault();var r=await db.auth.signInWithPassword({email:$('lEmail').value,password:$('lPass').value});if(r.error)authMsg(r.error.message,'err');else authMsg('Logged in ✓','ok')};
$('signupForm').onsubmit=async function(e){e.preventDefault();var r=await db.auth.signUp({email:$('sEmail').value,password:$('sPass').value,options:{data:{full_name:$('sName').value.trim()}}});if(r.error)authMsg(r.error.message,'err');else authMsg('Account created. Check your email if verification is enabled.','ok')};
$('forgot').onclick=async function(){var email=$('lEmail').value.trim();if(!email){authMsg('Enter your email first.','err');return}var r=await db.auth.resetPasswordForEmail(email,{redirectTo:location.href});authMsg(r.error?r.error.message:'Password reset email sent.',r.error?'err':'ok')};
function openEdit(target){$('editModal').hidden=false;document.body.style.overflow='hidden';var input=target&&$(target);if(input)setTimeout(()=>input.focus(),120)}function closeEdit(){$('editModal').hidden=true;document.body.style.overflow=''}
$('editBtn').onclick=()=>openEdit();$('closeEdit').onclick=closeEdit;$('editModal').addEventListener('click',e=>{if(e.target===$('editModal'))closeEdit()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEdit()});document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>openEdit(el.getAttribute('data-edit')));
async function save(){var upd={full_name:$('profileName').value.trim(),username:$('profileUsername').value.trim()||null,bio:$('profileBio').value.trim(),country:$('profileCountry').value.trim(),city:$('profileCity').value.trim(),phone_number:$('profilePhone').value.trim(),website_url:$('profileWebsite').value.trim(),occupation:$('profileOccupation').value.trim(),education:$('profileEducation').value.trim()};var r=await db.from('profiles').update(upd).eq('id',me.id);if(r.error){msg(r.error.message,'err');return}fill(Object.assign({},upd,{avatar_url:$('avatar').src,cover_url:$('coverPreview').src}));msg('Profile saved ✓','ok');setTimeout(closeEdit,500)}$('saveProfile').onclick=save;$('logout').onclick=async()=>{await db.auth.signOut();showAuth()};
async function upload(file,kind){if(!file)return;if(file.size>5*1024*1024){msg('Image must be under 5MB','err');return}var ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';var path='avatars/'+me.id+'/'+kind+'-'+Date.now()+'.'+ext;msg('Uploading...','');var up=await db.storage.from('product-media').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type||undefined});if(up.error){msg('Upload failed: '+up.error.message,'err');return}var url=db.storage.from('product-media').getPublicUrl(path).data.publicUrl;var field=kind==='avatar'?'avatar_url':'cover_url',obj={};obj[field]=url;var r=await db.from('profiles').update(obj).eq('id',me.id);if(r.error){msg(r.error.message,'err');return}if(kind==='avatar'){$('avatar').src=url;$('avatarPreview').src=url}else{$('cover').style.backgroundImage='url("'+url+'")';$('coverPreview').src=url}msg((kind==='avatar'?'Profile picture':'Cover picture')+' updated ✓','ok')}
$('avatarFile').onchange=e=>{upload(e.target.files[0],'avatar');e.target.value=''};$('coverFile').onchange=e=>{upload(e.target.files[0],'cover');e.target.value=''};
load();
})();
</script>
</body></html>
