<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>My Account — PromptHub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:Arial,sans-serif;background:#f7f7fb;color:#17171c;line-height:1.5}
a{color:inherit}
.nav{background:#fff;border-bottom:1px solid #e8e8ee;padding:17px 20px}
.nav-inner{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:22px;font-weight:800;text-decoration:none}.logo span{font-weight:400}
.back{color:#555;font-size:14px;text-decoration:none}
.container{max-width:900px;margin:35px auto;padding:0 16px}
.card{background:#fff;border:1px solid #e4e4eb;border-radius:18px;padding:24px;margin-bottom:16px}
.narrow{max-width:440px;margin-left:auto;margin-right:auto}
h1{font-size:26px}h2{font-size:20px;margin-bottom:12px}
.muted{color:#6b6b75;font-size:14px}
input,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin:6px 0 10px;font-size:15px;font-family:inherit}
textarea{min-height:70px;resize:vertical}
.btn{border:0;border-radius:10px;padding:11px 17px;background:#17171c;color:#fff;font-weight:700;cursor:pointer;font-family:inherit;font-size:14px}
.btn.ghost{background:#e9e9ef;color:#17171c}
.btn.small{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.6;cursor:wait}
.link{background:none;border:0;color:#555;text-decoration:underline;cursor:pointer;font-size:13px;margin-top:10px;font-family:inherit}
.seg{display:flex;gap:6px;margin-bottom:16px}
.seg button{flex:1;border:1px solid #e0e0e8;background:#fff;border-radius:10px;padding:10px;font-weight:700;cursor:pointer;font-family:inherit}
.seg button.on{background:#17171c;color:#fff;border-color:#17171c}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:1px solid #e0e0e8;background:#fff;border-radius:99px;padding:9px 16px;font-weight:700;cursor:pointer;font-family:inherit;font-size:14px}
.tabs button.on{background:#17171c;color:#fff;border-color:#17171c}
.orow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:#eee;text-transform:uppercase;letter-spacing:.4px}
.pill.paid{background:#dcfce7;color:#166534}.pill.pending{background:#fef3c7;color:#92400e}.pill.cancelled{background:#fee2e2;color:#991b1b}
.instr{background:#f4f4f9;border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;margin:12px 0 4px}
.ok{color:#166534;font-size:14px;margin-top:10px}.err{color:#991b1b;font-size:14px;margin-top:10px}
.msg{font-size:14px;margin-top:10px;min-height:20px}.msg.ok{color:#166534}.msg.err{color:#991b1b}
pre.prompt{background:#17171c;color:#ddd;border-radius:10px;padding:16px;font-size:14px;white-space:pre-wrap;word-break:break-word;margin-top:12px;font-family:inherit}
.chatbox{background:#f8fafc;border-radius:14px;padding:14px;height:340px;overflow:auto;border:1px solid #e5e7eb}
.bubble{max-width:78%;padding:9px 12px;border-radius:12px;margin:7px 0;font-size:14px;white-space:pre-wrap;word-break:break-word}
.bubble.mine{margin-left:auto;background:#17171c;color:#fff}.bubble.theirs{background:#e5e7eb}
.compose{display:flex;gap:8px;margin-top:10px}.compose input{margin:0;flex:1}
.binance-pay-box{margin-top:12px;padding:14px;border:1px solid #e4e4eb;border-radius:14px;background:#fafafe;text-align:left}.binance-pay-box b{font-size:15px}.binance-pay-box img{background:#fff}
.sp-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sp-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sp-actions .btn.small.green{background:#166534}.sp-actions .btn.small.red{background:#991b1b}
.sp-stat{color:#6b6b75;font-size:13px;margin-top:4px}
select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin:6px 0 10px;font-size:15px;font-family:inherit;background:#fff}
</style>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#020817">
</head>
<body>
<nav class="nav">
<div class="nav-inner">
<a class="logo" href="index.html">Prompt<span>Hub</span></a>
<a class="back" href="index.html">← Back to Store</a>
</div>
</nav>

<main class="container">
<div class="card narrow" id="status" role="status">Loading…</div>

<section class="card narrow" id="authView" hidden>
<div class="seg">
<button type="button" id="tabLogin" class="on">Login</button>
<button type="button" id="tabSignup">Sign up</button>
</div>

<form id="loginForm">
<label for="lEmail" class="muted">Email</label>
<input id="lEmail" type="email" autocomplete="email" required>
<label for="lPass" class="muted">Password</label>
<input id="lPass" type="password" autocomplete="current-password" required>
<button class="btn" style="width:100%">Login</button>
<button type="button" class="link" id="forgot">Forgot password?</button>
</form>

<form id="signupForm" hidden>
<label for="sName" class="muted">Full name</label>
<input id="sName" type="text" autocomplete="name" maxlength="120" required>
<label for="sEmail" class="muted">Email</label>
<input id="sEmail" type="email" autocomplete="email" required>
<label for="sPass" class="muted">Password (min. 8 characters)</label>
<input id="sPass" type="password" autocomplete="new-password" minlength="8" required>
<button class="btn" style="width:100%">Create account</button>
</form>
<div id="authMsg" class="msg" role="status"></div>
</section>

<section class="card narrow" id="resetView" hidden>
<h2>Set a new password</h2>
<form id="resetForm">
<label for="rPass" class="muted">New password (min. 8 characters)</label>
<input id="rPass" type="password" autocomplete="new-password" minlength="8" required>
<button class="btn" style="width:100%">Save password</button>
</form>
<div id="resetMsg" class="msg" role="status"></div>
</section>

<section id="dashView" hidden>
<div class="head">
<h1 id="hello"></h1>
<button class="btn ghost" id="logout" type="button">Logout</button>
</div>
<div class="tabs" id="tabs">
<button type="button" data-tab="orders" class="on">Orders</button>
<button type="button" data-tab="prompts">My Prompts</button>
<button type="button" data-tab="favorites">❤️ Favorites</button>
<button type="button" data-tab="notifications">🔔 Notifications</button>
<button type="button" data-tab="pro">🚀 Pro Hub</button>
<button type="button" data-tab="sell">💼 Sell</button>
<button type="button" data-tab="chat">Support chat</button>
</div>

<div id="pane-orders"><div id="ordersList"></div></div>

<div id="pane-prompts" hidden><div id="promptsList"></div></div>

    <div id="pane-favorites" hidden><div id="favoritesList"></div></div>
    <div id="pane-notifications" hidden><div id="notificationsList"></div></div>
    <div id="pane-pro" hidden><div id="proHub"></div></div>
    <div id="pane-sell" hidden><div id="sellHub"></div></div>


<div id="pane-chat" hidden>
<div class="card">
<h2>Message the store</h2>
<div class="chatbox" id="chatBox" aria-live="polite"></div>
<form class="compose" id="chatForm">
<input id="chatInput" maxlength="2000" placeholder="Write a message..." aria-label="Message" required>
<button class="btn">Send</button>
</form>
<div id="chatMsg" class="msg err" role="alert"></div>
</div>
</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/common.js"></script>
<script>
(function () {
  'use strict';
  var PH = window.PH;
  var db = PH.db;
  var esc = PH.esc;
  var $ = function (id) { return document.getElementById(id); };

  var me = null;
  var currentTab = 'orders';
  var convId = null;
  var chatKey = '';
  var pollTimer = null;
  var promptsCache = [];

  function setMsg(el, text, kind) {
    el.textContent = text || '';
    el.className = 'msg' + (kind ? ' ' + kind : '');
  }

  // Only allow redirects to a page in this same folder (no open redirect).
  function safeNext() {
    var n = new URLSearchParams(location.search).get('next');
    return /^[a-z0-9_-]+\.html(\?[a-z0-9=&_-]*)?$/i.test(n || '') ? n : null;
  }

  function showView(name) {
    $('status').hidden = true;
    $('authView').hidden = name !== 'auth';
    $('resetView').hidden = name !== 'reset';
    $('dashView').hidden = name !== 'dash';
  }

  /* ---------- auth ---------- */

  function authTab(which) {
    var login = which === 'login';
    $('tabLogin').classList.toggle('on', login);
    $('tabSignup').classList.toggle('on', !login);
    $('loginForm').hidden = !login;
    $('signupForm').hidden = login;
    setMsg($('authMsg'), '');
  }
  $('tabLogin').onclick = function () { authTab('login'); };
  $('tabSignup').onclick = function () { authTab('signup'); };

  $('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    setMsg($('authMsg'), 'Signing in…');
    var r = await db.auth.signInWithPassword({ email: $('lEmail').value.trim(), password: $('lPass').value });
    if (r.error) { setMsg($('authMsg'), r.error.message, 'err'); return; }
    setMsg($('authMsg'), '');
    await enter(r.data.user);
  });

  $('signupForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var pass = $('sPass').value;
    if (pass.length < 8) { setMsg($('authMsg'), 'Password must be at least 8 characters.', 'err'); return; }
    setMsg($('authMsg'), 'Creating account…');
    var r = await db.auth.signUp({
      email: $('sEmail').value.trim(),
      password: pass,
      options: { data: { full_name: $('sName').value.trim() } }
    });
    if (r.error) { setMsg($('authMsg'), r.error.message, 'err'); return; }
    if (r.data.session) { setMsg($('authMsg'), ''); await enter(r.data.user); return; }
    setMsg($('authMsg'), 'Account created. Please check your email to confirm it, then log in.', 'ok');
  });

  $('forgot').addEventListener('click', async function () {
    var email = $('lEmail').value.trim();
    if (!email) { setMsg($('authMsg'), 'Enter your email above first.', 'err'); return; }
    var r = await db.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    if (r.error) { setMsg($('authMsg'), r.error.message, 'err'); return; }
    setMsg($('authMsg'), 'If an account exists for that email, a reset link has been sent.', 'ok');
  });

  $('resetForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var r = await db.auth.updateUser({ password: $('rPass').value });
    if (r.error) { setMsg($('resetMsg'), r.error.message, 'err'); return; }
    setMsg($('resetMsg'), 'Password updated.', 'ok');
    var s = await db.auth.getSession();
    if (s.data && s.data.session) { history.replaceState(null, '', location.pathname); await enter(s.data.session.user); }
  });

  $('logout').addEventListener('click', async function () {
    await db.auth.signOut();
    signedOut();
  });

  function signedOut() {
    me = null; convId = null; chatKey = '';
    stopPoll();
    showView('auth');
  }

  /* ---------- dashboard ---------- */

  async function enter(user) {
    var n = safeNext();
    if (n) { location.replace(n); return; }
    me = user;
    var p = await db.from('profiles').select('full_name').eq('id', user.id).maybeSingle();
    var name = (p.data && p.data.full_name) || user.email || 'there';
    $('hello').textContent = 'Hi, ' + name;
    showView('dash');
    var h = location.hash.replace('#', '');
    selectTab(['orders', 'prompts', 'favorites', 'notifications', 'pro', 'sell', 'chat'].indexOf(h) !== -1 ? h : 'orders');
    startPoll();
  }

  function selectTab(name) {
    currentTab = name;
    document.querySelectorAll('#tabs button').forEach(function (b) {
      b.classList.toggle('on', b.dataset.tab === name);
    });
    ['orders', 'prompts', 'favorites', 'notifications', 'pro', 'sell', 'chat'].forEach(function (t) { $('pane-' + t).hidden = t !== name; });
    if (name === 'orders') loadOrders();
    if (name === 'prompts') loadPrompts();
    if (name === 'favorites') loadFavorites();
    if (name === 'notifications') loadNotifications();
    if (name === 'pro') loadProHub();
    if (name === 'sell') loadSellHub();
    if (name === 'chat') loadChat(true);
  }
  async function loadFavorites(){
    var el=$('favoritesList'); el.innerHTML='<div class="card muted">Loading…</div>';
    var ids=[]; try{ids=JSON.parse(localStorage.getItem('ph_favorites_v1')||'[]').map(Number)}catch(e){ }
    if(!ids.length){el.innerHTML='<div class="card muted">No favorites yet. <a href="index.html">Browse prompts</a></div>';return;}
    var r=await db.from('products').select('id,name,category,price,currency,is_free,description').in('id',ids).eq('active',true);
    if(r.error){el.innerHTML='<div class="card err">'+esc(r.error.message)+'</div>';return;}
    el.innerHTML=(r.data||[]).map(function(p){var free=!!p.is_free||Number(p.price)===0;return '<div class="card"><div class="orow"><b>'+esc(p.name)+'</b><a class="btn small" href="product.html?id='+Number(p.id)+'">View</a></div><div class="muted">'+esc(p.category)+' · '+(free?'FREE':PH.money(p.price,p.currency))+'</div><p>'+esc(p.description||'')+'</p></div>'}).join('')||'<div class="card muted">No active favorites.</div>';
  }
  async function loadNotifications(){
    var el=$('notificationsList'); el.innerHTML='<div class="card muted">Loading…</div>';
    var r=await db.from('notifications').select('id,title,body,read_at,created_at').order('created_at',{ascending:false}).limit(50);
    if(r.error){el.innerHTML='<div class="card muted">Notifications will appear here when enabled by the Pro Features SQL.</div>';return;}
    el.innerHTML=(r.data||[]).map(function(n){return '<div class="card"><div class="orow"><b>'+esc(n.title)+'</b><small class="muted">'+new Date(n.created_at).toLocaleString()+'</small></div><p>'+esc(n.body)+'</p></div>'}).join('')||'<div class="card muted">No notifications.</div>';
    var unread=(r.data||[]).filter(function(n){return !n.read_at}).map(function(n){return n.id});
    if(unread.length) await db.from('notifications').update({read_at:new Date().toISOString()}).in('id',unread);
  }
  function loadProHub(){
    var code=(me&&me.id?me.id.replace(/-/g,'').slice(0,8):'PROMPTER').toUpperCase();
    var recent=[];try{recent=JSON.parse(localStorage.getItem('ph_recent_v1')||'[]').map(Number)}catch(e){}
    $('proHub').innerHTML='<h2>🚀 PromptHub Pro Hub</h2><p class="muted">Your marketplace extras and quick tools.</p><div class="card"><b>🔗 Referral code</b><p style="margin:6px 0">'+code+'</p><button class="btn small" id="copyRef">Copy code</button></div><div class="card"><b>🏆 Badges</b><p style="margin:6px 0">'+(recent.length?'Explorer · Prompt Collector':'New Member · Start exploring')+'</p></div><div class="card"><b>🕐 Recently viewed</b><p style="margin:6px 0">'+(recent.length?recent.map(function(id){return '<a href="product.html?id='+id+'" style="text-decoration:underline;margin-right:8px">Prompt #'+id+'</a>'}).join(''):'No recent prompts yet.')+'</p></div>';
    var b=document.getElementById('copyRef');if(b)b.onclick=async function(){try{await navigator.clipboard.writeText(code);b.textContent='Copied ✓'}catch(e){}};
  }

  /* ---------- sell (seller dashboard) ---------- */

  var sellerProducts = [];
  var sellerCommissionPercent = 10;
  var editingProductId = null;

  function becomeSellerForm(sp) {
    return '<div class="card"><h2>💼 Become a Seller</h2>' +
      '<p class="muted">List your own AI prompts and set your own prices. Buyers pay you directly — no admin approval needed to start.</p>' +
      '<form id="becomeSellerForm">' +
      '<label class="muted">Display name (shown to buyers)</label>' +
      '<input name="disp" maxlength="80" placeholder="e.g. Ali\'s Prompts" value="' + esc(sp.seller_display_name || '') + '">' +
      '<label class="muted">Payment method</label>' +
      '<input name="method" maxlength="60" placeholder="e.g. Binance Pay" required value="' + esc(sp.seller_payment_method || '') + '">' +
      '<label class="muted">Payment details (buyers send money here — e.g. your Binance UID)</label>' +
      '<input name="details" maxlength="200" placeholder="e.g. Binance UID 123456789" required value="' + esc(sp.seller_payment_details || '') + '">' +
      '<div class="muted" style="margin:4px 0 10px">Platform commission: <b>' + sellerCommissionPercent + '%</b> — you keep ' + (100 - sellerCommissionPercent) + '% of each sale (tracked for bookkeeping; you receive full payment directly, and pay the commission to the admin separately).</div>' +
      '<button class="btn" style="width:100%">Start Selling</button>' +
      '<div id="becomeSellerMsg" class="msg" role="status"></div>' +
      '</form></div>';
  }

  function sellerInfoCard(sp) {
    return '<div class="card"><div class="sp-row"><b>' + esc(sp.seller_display_name || 'Your seller profile') + '</b>' +
      '<button class="btn small ghost" type="button" id="editSellerInfo">Edit payment info</button></div>' +
      '<div class="muted" style="margin-top:6px">' + esc(sp.seller_payment_method || '') + ' — ' + esc(sp.seller_payment_details || '') + '</div>' +
      '<div class="sp-stat">Platform commission: ' + sellerCommissionPercent + '% per sale (you keep ' + (100 - sellerCommissionPercent) + '%)</div>' +
      '</div>';
  }

  function productFormCard() {
    return '<div class="card" id="productFormCard" hidden>' +
      '<h2 id="spFormTitle">Add Product</h2>' +
      '<form id="sellProductForm">' +
      '<input type="hidden" id="spId">' +
      '<label class="muted">Name</label><input id="spName" maxlength="120" required>' +
      '<label class="muted">Category</label><select id="spCat" required><option value="image">Image prompt</option><option value="video">Video prompt</option></select>' +
      '<div class="seg" style="margin-top:4px"><button type="button" id="spPaidBtn" class="on">Paid</button><button type="button" id="spFreeBtn">Free</button></div>' +
      '<input type="hidden" id="spFree" value="false">' +
      '<label class="muted">Price</label><input id="spPrice" type="number" min="0.01" step="0.01" value="5">' +
      '<label class="muted">Currency</label><input id="spCurrency" maxlength="8" value="USD">' +
      '<label class="muted">Description</label><textarea id="spDesc" maxlength="600"></textarea>' +
      '<label class="muted">Prompt text (the secret content buyers unlock)</label><textarea id="spPrompt" maxlength="8000" required style="min-height:120px"></textarea>' +
      '<label class="muted">Add images</label><input id="spImages" type="file" accept="image/*" multiple>' +
      '<label class="muted">Add videos</label><input id="spVideos" type="file" accept="video/*" multiple>' +
      '<div id="spCurrentMedia" style="margin:6px 0"></div>' +
      '<label style="display:flex;align-items:center;gap:8px;font-weight:400;margin:10px 0"><input type="checkbox" id="spActive" style="width:auto" checked> Active (visible in the store)</label>' +
      '<button class="btn" style="width:100%">Save Product</button> ' +
      '<button type="button" class="btn ghost" id="spCancel" style="width:100%;margin-top:8px">Cancel</button>' +
      '<div id="spMsg" class="msg" role="status"></div>' +
      '</form></div>';
  }

  function productRow(p) {
    var free = !!p.is_free || Number(p.price) === 0;
    return '<div class="card"><div class="sp-row"><b>' + esc(p.name) + '</b><span class="pill ' + (p.active ? 'paid' : 'cancelled') + '">' + (p.active ? 'Active' : 'Hidden') + '</span></div>' +
      '<div class="muted">' + esc(p.category) + ' · ' + (free ? 'FREE' : esc(PH.money(p.price, p.currency))) + ' · ' + Number(p.sold_count || 0) + ' sold</div>' +
      (Number(p.unpaid_commission || 0) > 0 ? '<div class="sp-stat">Commission owed to admin: ' + esc(PH.money(p.unpaid_commission, p.currency)) + '</div>' : '') +
      '<div class="sp-actions">' +
      '<button class="btn small" type="button" data-sp-edit="' + Number(p.id) + '">Edit</button>' +
      '<button class="btn small ' + (p.active ? 'red' : 'green') + '" type="button" data-sp-toggle="' + Number(p.id) + '" data-active="' + (p.active ? '1' : '0') + '">' + (p.active ? 'Deactivate' : 'Activate') + '</button>' +
      '<button class="btn small red" type="button" data-sp-delete="' + Number(p.id) + '">Delete</button>' +
      '<a class="btn small ghost" href="product.html?id=' + Number(p.id) + '">View</a>' +
      '</div></div>';
  }

  function saleRow(x) {
    var o = x.orders || {};
    var pending = x.status === 'pending';
    return '<div class="card"><div class="sp-row"><b>' + esc((o.products && o.products.name) || 'Prompt') + '</b><span class="pill ' + (pending ? 'pending' : (x.status === 'approved' ? 'paid' : 'cancelled')) + '">' + esc(x.status) + '</span></div>' +
      '<div class="muted">' + esc(PH.money(o.amount, o.currency)) + ' · ref: ' + esc(x.transaction_ref || '') + (x.note ? ' · ' + esc(x.note) : '') + '</div>' +
      (pending ? '<div class="sp-actions"><button class="btn small green" type="button" data-sp-pay="approved" data-id="' + Number(x.id) + '">Approve (I received the payment)</button><button class="btn small red" type="button" data-sp-pay="rejected" data-id="' + Number(x.id) + '">Reject</button></div>' : '') +
      '</div>';
  }

  async function loadSellHub() {
    var el = $('sellHub');
    el.innerHTML = '<div class="card muted">Loading…</div>';
    var results = await Promise.all([
      db.from('profiles').select('is_seller,seller_banned,seller_display_name,seller_payment_method,seller_payment_details').eq('id', me.id).maybeSingle(),
      db.from('platform_settings').select('commission_percent').maybeSingle()
    ]);
    var pr = results[0], cs = results[1];
    if (pr.error || !pr.data) { el.innerHTML = '<div class="card err">Seller system is not set up yet. Please run the marketplace SQL patch.</div>'; return; }
    if (!cs.error && cs.data) sellerCommissionPercent = Number(cs.data.commission_percent);
    var sp = pr.data;

    if (sp.seller_banned) {
      el.innerHTML = '<div class="card err"><b>Your seller account has been suspended.</b><p class="muted" style="margin-top:6px">Contact support if you think this is a mistake.</p></div>';
      return;
    }
    if (!sp.is_seller) {
      el.innerHTML = becomeSellerForm(sp);
      return;
    }

    el.innerHTML = sellerInfoCard(sp) +
      '<button class="btn" type="button" id="newProductBtn" style="margin-bottom:14px">+ Add New Product</button>' +
      productFormCard() +
      '<h2 style="margin:18px 0 8px">My Products</h2><div id="sellProductsList"><div class="card muted">Loading…</div></div>' +
      '<h2 style="margin:18px 0 8px">My Sales</h2><div id="sellSalesList"><div class="card muted">Loading…</div></div>';

    loadSellerProducts();
    loadSellerSales();
  }

  async function loadSellerProducts() {
    var list = $('sellProductsList');
    var r = await db.rpc('get_seller_products');
    if (r.error) { list.innerHTML = '<div class="card err">' + esc(r.error.message) + '</div>'; return; }
    sellerProducts = r.data || [];
    list.innerHTML = sellerProducts.map(productRow).join('') || '<div class="card muted">No products yet. Add your first one above.</div>';
  }

  async function loadSellerSales() {
    var list = $('sellSalesList');
    var r = await db.from('payment_submissions')
      .select('id,method,transaction_ref,note,status,created_at,orders(amount,currency,products(name))')
      .order('created_at', { ascending: false })
      .limit(50);
    if (r.error) { list.innerHTML = '<div class="card err">' + esc(r.error.message) + '</div>'; return; }
    var rows = (r.data || []).filter(function (x) { return x.orders; });
    list.innerHTML = rows.map(saleRow).join('') || '<div class="card muted">No sales yet.</div>';
  }

  $('sellHub').addEventListener('submit', async function (e) {
    if (e.target.id === 'becomeSellerForm') {
      e.preventDefault();
      var f = e.target;
      var msg = $('becomeSellerMsg');
      setMsg(msg, 'Saving…');
      var btn = f.querySelector('button');
      btn.disabled = true;
      var r = await db.rpc('become_seller', {
        p_display_name: f.elements.disp.value.trim(),
        p_payment_method: f.elements.method.value.trim(),
        p_payment_details: f.elements.details.value.trim()
      });
      btn.disabled = false;
      if (r.error) { setMsg(msg, r.error.message, 'err'); return; }
      loadSellHub();
      return;
    }
    if (e.target.id === 'sellProductForm') {
      e.preventDefault();
      var pm = $('spMsg');
      var saveBtn = e.target.querySelector('button.btn');
      saveBtn.disabled = true;
      setMsg(pm, 'Saving…');
      try {
        var idVal = $('spId').value;
        var r2 = await db.rpc('seller_save_product', {
          p_id: idVal ? Number(idVal) : null,
          p_name: $('spName').value.trim(),
          p_category: $('spCat').value,
          p_price: Number($('spPrice').value),
          p_currency: $('spCurrency').value.trim().toUpperCase(),
          p_is_free: $('spFree').value === 'true',
          p_description: $('spDesc').value.trim(),
          p_prompt: $('spPrompt').value,
          p_active: $('spActive').checked
        });
        if (r2.error) { setMsg(pm, r2.error.message, 'err'); return; }
        var productId = Number(r2.data);
        var imageFiles = Array.prototype.slice.call(($('spImages') || {}).files || []);
        var videoFiles = Array.prototype.slice.call(($('spVideos') || {}).files || []);
        var allFiles = imageFiles.map(function (f) { return { file: f, kind: 'image' }; }).concat(videoFiles.map(function (f) { return { file: f, kind: 'video' }; }));
        var nextOrder = 100;
        for (var i = 0; i < allFiles.length; i++) {
          setMsg(pm, 'Uploading media ' + (i + 1) + ' of ' + allFiles.length + '…');
          var item = allFiles[i];
          var max = item.kind === 'image' ? 5 * 1024 * 1024 : 50 * 1024 * 1024;
          if (item.file.size > max) throw new Error((item.kind === 'image' ? 'Image' : 'Video') + ' "' + item.file.name + '" is too large.');
          var ext = (item.file.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '');
          var rid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now() + '-' + Math.random().toString(36).slice(2));
          var path = 'products/' + rid + '-' + item.kind + '.' + ext;
          var up = await db.storage.from('product-media').upload(path, item.file, { cacheControl: '3600', upsert: false, contentType: item.file.type || undefined });
          if (up.error) throw new Error('Could not upload ' + item.kind + ': ' + up.error.message);
          var pub = db.storage.from('product-media').getPublicUrl(path).data.publicUrl;
          var ins = await db.from('product_media').insert({ product_id: productId, media_type: item.kind, media_url: pub, storage_path: path, sort_order: nextOrder++ });
          if (ins.error) throw new Error('Could not save ' + item.kind + ' to gallery: ' + ins.error.message);
        }
        setMsg(pm, 'Saved ✓', 'ok');
        $('productFormCard').hidden = true;
        e.target.reset();
        editingProductId = null;
        loadSellerProducts();
      } catch (err) {
        setMsg(pm, err && err.message ? err.message : String(err), 'err');
      } finally {
        saveBtn.disabled = false;
      }
      return;
    }
  });

  $('sellHub').addEventListener('click', async function (e) {
    if (e.target.id === 'editSellerInfo') {
      var p = await db.from('profiles').select('seller_display_name,seller_payment_method,seller_payment_details').eq('id', me.id).maybeSingle();
      $('sellHub').innerHTML = becomeSellerForm(p.data || {}) + '<p class="muted" style="text-align:center"><button type="button" class="link" id="spBackToDash">← Back to seller dashboard</button></p>';
      $('sellHub').querySelector('#spBackToDash').onclick = loadSellHub;
      return;
    }
    if (e.target.id === 'newProductBtn') {
      editingProductId = null;
      $('spFormTitle').textContent = 'Add Product';
      $('sellProductForm').reset();
      $('spId').value = '';
      $('spCat').value = 'image';
      $('spCurrency').value = 'USD';
      $('spCurrentMedia').innerHTML = '';
      setPricingModeSell('paid');
      $('productFormCard').hidden = false;
      $('productFormCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    if (e.target.id === 'spCancel') {
      $('productFormCard').hidden = true;
      editingProductId = null;
      return;
    }
    if (e.target.id === 'spFreeBtn') { setPricingModeSell('free'); return; }
    if (e.target.id === 'spPaidBtn') { setPricingModeSell('paid'); return; }

    var editBtn = e.target.closest('[data-sp-edit]');
    if (editBtn) {
      var id = Number(editBtn.dataset.spEdit);
      var pr = sellerProducts.filter(function (x) { return Number(x.id) === id; })[0];
      if (!pr) return;
      var promptR = await db.rpc('get_seller_prompt', { p_product_id: id });
      var mediaR = await db.from('product_media').select('id,media_type,media_url,storage_path').eq('product_id', id).order('sort_order');
      editingProductId = id;
      $('spFormTitle').textContent = 'Edit Product #' + id;
      $('spId').value = id;
      $('spName').value = pr.name;
      $('spCat').value = pr.category;
      $('spPrice').value = pr.price;
      $('spCurrency').value = pr.currency;
      setPricingModeSell(pr.is_free || Number(pr.price) === 0 ? 'free' : 'paid');
      $('spDesc').value = '';
      $('spPrompt').value = promptR.error ? '' : (promptR.data || '');
      $('spImages').value = ''; $('spVideos').value = '';
      var mm = (mediaR.data || []);
      $('spCurrentMedia').innerHTML = mm.length ? ('<div class="muted">' + mm.length + ' existing media item(s). Uploading new files here adds to the gallery.</div>') : '';
      $('spActive').checked = !!pr.active;
      $('productFormCard').hidden = false;
      $('productFormCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    var toggleBtn = e.target.closest('[data-sp-toggle]');
    if (toggleBtn) {
      toggleBtn.disabled = true;
      var r = await db.rpc('seller_set_product_active', { p_id: Number(toggleBtn.dataset.spToggle), p_active: toggleBtn.dataset.active !== '1' });
      if (r.error) alert(r.error.message);
      loadSellerProducts();
      return;
    }
    var delBtn = e.target.closest('[data-sp-delete]');
    if (delBtn) {
      if (!confirm('Delete this product? This cannot be undone.')) return;
      delBtn.disabled = true;
      var r2 = await db.rpc('seller_delete_product', { p_id: Number(delBtn.dataset.spDelete) });
      if (r2.error) { alert(r2.error.message); delBtn.disabled = false; return; }
      loadSellerProducts();
      return;
    }
    var payBtn = e.target.closest('[data-sp-pay]');
    if (payBtn) {
      var status = payBtn.dataset.spPay;
      if (!confirm((status === 'approved' ? 'Confirm you received this payment?' : 'Reject this payment?'))) return;
      payBtn.disabled = true;
      var r3 = await db.rpc('seller_review_payment', { p_id: Number(payBtn.dataset.id), p_status: status });
      if (r3.error) alert(r3.error.message);
      loadSellerSales();
      loadSellerProducts();
      return;
    }
  });

  function setPricingModeSell(mode) {
    var free = mode === 'free';
    $('spFree').value = free ? 'true' : 'false';
    $('spFreeBtn').className = free ? 'on' : '';
    $('spPaidBtn').className = free ? '' : 'on';
    $('spPrice').disabled = free;
    if (free) $('spPrice').value = '0'; else if (!Number($('spPrice').value)) $('spPrice').value = '5';
  }

  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]');
    if (b) { history.replaceState(null, '', '#' + b.dataset.tab); selectTab(b.dataset.tab); }
  });

  /* ---------- orders ---------- */

  function payForm(o) {
    var sellerBox = o.seller_payment_snapshot
      ? '<div class="binance-pay-box"><b>💳 Pay the seller directly</b><div class="muted" style="margin-top:5px">' + esc(o.seller_payment_snapshot) + '</div></div>'
      : '<div class="binance-pay-box"><b>Binance Pay</b><div class="muted" style="margin-top:5px">UID: 984200359</div>' +
        '<img src="assets/binance-qr.jpg" alt="Binance Pay QR code" style="display:block;width:min(280px,100%);height:auto;margin:14px auto 8px;border-radius:12px;border:1px solid #e4e4eb">' +
        '<div class="muted" style="text-align:center">Scan the QR code to pay.</div></div>';
    return '<form class="payform" data-order="' + Number(o.id) + '">' +
      '<div class="instr">' + esc(PH.CONFIG.paymentInstructions) + '</div>' +
      sellerBox +
      '<input name="pay_method" value="Binance Pay" maxlength="60" required>' +
      '<input name="pay_ref" placeholder="Transaction ID / reference" minlength="3" maxlength="120" required>' +
      '<textarea name="pay_note" placeholder="Note (optional)" maxlength="500"></textarea>' +
      '<button class="btn">Submit payment</button><div class="msg" role="status"></div></form>';
  }

  function orderCard(o) {
    var subs = o.payment_submissions || [];
    var isFree = !!(o.products && o.products.is_free) || Number(o.amount) === 0;
    var pending = subs.some(function (s) { return s.status === 'pending'; });
    var rejected = !pending && subs.some(function (s) { return s.status === 'rejected'; });
    var html = '<div class="card"><div class="orow"><b>' + esc((o.products && o.products.name) || 'Prompt') + '</b>' +
      '<span class="pill ' + esc(o.status) + '">' + esc(o.status) + '</span></div>' +
      '<div class="muted">Order #' + Number(o.id) + ' · ' + esc(isFree ? 'FREE' : PH.money(o.amount, o.currency)) + ' · ' +
      esc(new Date(o.created_at).toLocaleString()) + '</div>';
    if (o.status === 'paid') {
      html += '<p class="ok">Payment verified. Your prompt is unlocked under <a href="#prompts" data-goto="prompts">My Prompts</a>.</p>';
    } else if (o.status === 'pending') {
      if (pending) {
        html += '<p class="muted" style="margin-top:10px">Payment submitted. Waiting for verification.</p>';
      } else {
        if (rejected) html += '<p class="err">Your last payment submission was rejected. Please check the details and submit again.</p>';
        html += payForm(o);
      }
    }
    return html + '</div>';
  }

  async function loadOrders() {
    var el = $('ordersList');
    el.innerHTML = '<div class="card muted">Loading…</div>';
    var r = await db.from('orders')
      .select('id,amount,currency,status,created_at,seller_payment_snapshot,products(name,is_free),payment_submissions(id,status)')
      .order('created_at', { ascending: false });
    if (r.error) { el.innerHTML = '<div class="card err">' + esc(r.error.message) + '</div>'; return; }
    if (!r.data.length) {
      el.innerHTML = '<div class="card muted">No orders yet. <a href="index.html#prompts">Browse prompts</a></div>';
      return;
    }
    el.innerHTML = r.data.map(orderCard).join('');
  }

  $('ordersList').addEventListener('click', function (e) {
    var g = e.target.closest('[data-goto]');
    if (g) { e.preventDefault(); history.replaceState(null, '', '#' + g.dataset.goto); selectTab(g.dataset.goto); }
  });

  $('ordersList').addEventListener('submit', async function (e) {
    var f = e.target.closest('form.payform');
    if (!f) return;
    e.preventDefault();
    var msg = f.querySelector('.msg');
    var btn = f.querySelector('button');
    btn.disabled = true;
    setMsg(msg, 'Submitting…');
    var r = await db.rpc('submit_payment', {
      p_order_id: Number(f.dataset.order),
      p_method: f.elements.pay_method.value.trim(),
      p_ref: f.elements.pay_ref.value.trim(),
      p_note: f.elements.pay_note.value.trim()
    });
    if (r.error) { setMsg(msg, r.error.message, 'err'); btn.disabled = false; return; }
    loadOrders();
  });

  /* ---------- prompts ---------- */

  async function loadPrompts() {
    var el = $('promptsList');
    el.innerHTML = '<div class="card muted">Loading…</div>';
    var r = await db.rpc('get_my_prompts');
    if (r.error) { el.innerHTML = '<div class="card err">' + esc(r.error.message) + '</div>'; return; }
    promptsCache = r.data || [];
    if (!promptsCache.length) {
      el.innerHTML = '<div class="card muted">Nothing unlocked yet. Prompts appear here after your payment is verified.</div>';
      return;
    }
    el.innerHTML = promptsCache.map(function (p, i) {
      var c = PH.CATEGORIES[p.category] || { label: p.category, icon: '📦' };
      return '<div class="card"><div class="orow"><b>' + esc(c.icon + ' ' + p.name) + '</b>' +
        '<button class="btn small" type="button" data-copy="' + i + '">Copy</button></div>' +
        '<pre class="prompt">' + esc(p.prompt) + '</pre></div>';
    }).join('');
  }

  $('promptsList').addEventListener('click', async function (e) {
    var b = e.target.closest('button[data-copy]');
    if (!b) return;
    var p = promptsCache[Number(b.dataset.copy)];
    if (!p) return;
    var ok = await PH.copyText(p.prompt);
    b.textContent = ok ? 'Copied ✓' : 'Copy failed';
    setTimeout(function () { b.textContent = 'Copy'; }, 1800);
  });

  /* ---------- chat ---------- */

  async function ensureConv() {
    if (convId) return convId;
    var r = await db.from('conversations').select('id').eq('customer_id', me.id).maybeSingle();
    if (r.error) throw r.error;
    if (r.data) convId = r.data.id;
    return convId;
  }

  async function loadChat(force) {
    var box = $('chatBox');
    try {
      await ensureConv();
      if (!convId) {
        if (force || chatKey !== 'empty') { box.innerHTML = '<div class="muted">No messages yet. Say hello!</div>'; chatKey = 'empty'; }
        return;
      }
      var r = await db.from('messages')
        .select('id,sender_id,message')
        .eq('conversation_id', convId)
        .order('created_at', { ascending: true })
        .order('id', { ascending: true });
      if (r.error) throw r.error;
      var rows = r.data || [];
      var key = rows.length + ':' + (rows.length ? rows[rows.length - 1].id : 0);
      if (!force && key === chatKey) return;     // nothing new: don't re-render / jump the scroll
      chatKey = key;
      box.innerHTML = rows.map(function (m) {
        return '<div class="bubble ' + (m.sender_id === me.id ? 'mine' : 'theirs') + '">' + esc(m.message) + '</div>';
      }).join('') || '<div class="muted">No messages yet. Say hello!</div>';
      box.scrollTop = box.scrollHeight;
    } catch (err) {
      setMsg($('chatMsg'), err.message || String(err), 'err');
    }
  }

  $('chatForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var text = $('chatInput').value.trim();
    if (!text) return;
    setMsg($('chatMsg'), '');
    try {
      await ensureConv();
      if (!convId) {
        var c = await db.from('conversations').insert({ customer_id: me.id }).select('id').single();
        if (c.error) {
          convId = null;
          await ensureConv();                       // maybe it was just created in another tab
          if (!convId) throw c.error;
        } else {
          convId = c.data.id;
        }
      }
      var r = await db.from('messages').insert({ conversation_id: convId, sender_id: me.id, message: text });
      if (r.error) throw r.error;
      $('chatInput').value = '';
      loadChat(true);
    } catch (err) {
      setMsg($('chatMsg'), err.message || String(err), 'err');
    }
  });

  // Poll only while the chat tab is open and the browser tab is visible.
  function startPoll() {
    stopPoll();
    pollTimer = setInterval(function () {
      if (currentTab === 'chat' && !document.hidden && me) loadChat(false);
    }, 5000);
  }
  function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

  /* ---------- start ---------- */

  async function init() {
    if (PH.initError) {
      $('status').textContent = 'Could not start: ' + PH.initError.message;
      return;
    }
    db.auth.onAuthStateChange(function (event) {
      if (event === 'SIGNED_OUT') setTimeout(signedOut, 0);
    });
    var s = await db.auth.getSession();
    var session = s.data && s.data.session;
    if (PH.isRecovery && session) { showView('reset'); return; }
    if (!session) { showView('auth'); return; }
    await enter(session.user);
  }

  init().catch(function (e) { $('status').hidden = false; $('status').textContent = 'Error: ' + (e.message || e); });
})();
</script>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
