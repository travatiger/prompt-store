<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — PromptHub</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#020817"><link rel="stylesheet" href="assets/theme.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f8fc;color:#17171c}.nav{background:#fff;border-bottom:1px solid #e5e7eb;padding:16px 20px}.nav-inner{max-width:980px;margin:auto;display:flex;align-items:center;justify-content:space-between}.logo{font-size:22px;font-weight:800;text-decoration:none}.logo span{font-weight:400}.back{color:#555;text-decoration:none;font-size:14px}.container{max-width:980px;margin:30px auto;padding:0 16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:24px;margin-bottom:18px;box-shadow:0 8px 25px rgba(0,0,0,.04)}.narrow{max-width:460px;margin:30px auto}h1{font-size:28px;margin:0 0 8px}h2{font-size:20px;margin:0 0 16px}.muted{color:#6b7280;font-size:14px}input,textarea{width:100%;padding:12px 13px;border:1px solid #d1d5db;border-radius:10px;margin:6px 0 14px;font-size:15px;font-family:inherit}textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:10px;padding:11px 17px;background:#17171c;color:#fff;font-weight:700;cursor:pointer;font-family:inherit}.btn.ghost{background:#ececf1;color:#17171c}.msg{min-height:20px;margin-top:10px;font-size:14px}.ok{color:#166534}.err{color:#991b1b}.seg{display:flex;gap:7px;margin:18px 0}.seg button{flex:1;border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px;font-weight:700;cursor:pointer}.seg button.on{background:#17171c;color:#fff}.profile-head{position:relative;overflow:hidden;border-radius:20px;background:#fff;border:1px solid #e5e7eb}.cover{height:250px;background:linear-gradient(135deg,#111827,#4f46e5);background-size:cover;background-position:center}.profile-body{padding:0 28px 28px;margin-top:-58px}.avatar{width:116px;height:116px;border-radius:50%;object-fit:cover;background:#e5e7eb;border:5px solid #fff;display:block}.profile-meta{display:flex;justify-content:space-between;align-items:flex-end;gap:15px}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{background:#f8fafc;border:1px solid #edf0f4;border-radius:13px;padding:13px}.field b{display:block;font-size:12px;color:#6b7280;margin-bottom:4px}.field span{word-break:break-word}.upload-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.media-control{border:1px dashed #cfd4dc;border-radius:14px;padding:14px}.media-control img{width:100%;height:120px;object-fit:cover;border-radius:10px;background:#eef0f4;display:block;margin-bottom:10px}.file-label{display:inline-block;padding:9px 12px;background:#ececf1;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer}@media(max-width:650px){.grid,.upload-row{grid-template-columns:1fr}.profile-meta{align-items:flex-start;flex-direction:column}.cover{height:190px}.profile-body{padding:0 18px 20px}.container{margin-top:18px}.actions{width:100%}.actions .btn{flex:1}}
</style></head>
<body>
<nav class="nav"><div class="nav-inner"><a class="logo" href="index.html">Prompt<span>Hub</span></a><a class="back" href="index.html">← Home</a></div></nav>
<main class="container">
<div class="card narrow" id="status">Loading…</div>
<section class="card narrow" id="authView" hidden>
<h1>My Profile</h1><p class="muted">Login to manage your personal profile.</p>
<div class="seg"><button id="tabLogin" class="on" type="button">Login</button><button id="tabSignup" type="button">Sign up</button></div>
<button class="btn ghost" id="googleBtn" style="width:100%;margin-bottom:12px" type="button">Continue with Google</button>
<div id="loginBox"><form id="loginForm"><label class="muted">Email</label><input id="lEmail" type="email" required autocomplete="email"><label class="muted">Password</label><input id="lPass" type="password" required autocomplete="current-password"><button class="btn" style="width:100%">Login</button></form><button class="btn" id="forgot" style="margin-top:10px;background:none;color:#555;padding-left:0" type="button">Forgot password?</button></div>
<div id="signupBox" hidden><form id="signupForm"><label class="muted">Full name</label><input id="sName" maxlength="120" required autocomplete="name"><label class="muted">Email</label><input id="sEmail" type="email" required autocomplete="email"><label class="muted">Password (min. 8 characters)</label><input id="sPass" type="password" minlength="8" required autocomplete="new-password"><button class="btn" style="width:100%">Create account</button></form></div>
<div id="authMsg" class="msg"></div></section>

<section id="profileView" hidden>
<div class="profile-head">
<div id="cover" class="cover"></div>
<div class="profile-body"><div class="profile-meta"><div><img id="avatar" class="avatar" alt="Profile picture"><h1 id="displayName" style="margin-top:12px">Your Name</h1><p id="displayUsername" class="muted">@username</p></div><div class="actions"><button class="btn ghost" id="logout" type="button">Logout</button><button class="btn" id="saveTop" type="button">Save changes</button></div></div></div></div>
<div class="card"><h2>About</h2><p id="displayBio" class="muted">Tell people about yourself.</p><div class="grid"><div class="field"><b>Country</b><span id="displayCountry">—</span></div><div class="field"><b>City</b><span id="displayCity">—</span></div><div class="field"><b>Phone</b><span id="displayPhone">—</span></div><div class="field"><b>Website</b><span id="displayWebsite">—</span></div><div class="field"><b>Occupation</b><span id="displayOccupation">—</span></div><div class="field"><b>Education</b><span id="displayEducation">—</span></div></div></div>
<div class="card"><h2>Edit profile</h2><div class="upload-row"><div class="media-control"><img id="avatarPreview" alt="Profile preview"><label class="file-label" for="avatarFile">Change profile picture</label><input id="avatarFile" type="file" accept="image/*" hidden></div><div class="media-control"><img id="coverPreview" alt="Cover preview"><label class="file-label" for="coverFile">Change cover picture</label><input id="coverFile" type="file" accept="image/*" hidden></div></div>
<label>Full name</label><input id="profileName" maxlength="120"><label>Username</label><input id="profileUsername" maxlength="32" placeholder="yourusername"><label>About / Bio</label><textarea id="profileBio" maxlength="1000"></textarea><div class="grid"><div><label>Country</label><input id="profileCountry" maxlength="80"></div><div><label>City</label><input id="profileCity" maxlength="80"></div><div><label>Phone number</label><input id="profilePhone" maxlength="40"></div><div><label>Website</label><input id="profileWebsite" maxlength="300" placeholder="https://..."></div><div><label>Occupation</label><input id="profileOccupation" maxlength="120"></div><div><label>Education</label><input id="profileEducation" maxlength="160"></div></div><button class="btn" id="saveProfile" type="button">Save Profile</button><div id="profileMsg" class="msg"></div></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/common.js"></script>
<script>
(function(){'use strict';var PH=window.PH,db=PH.db,$=id=>document.getElementById(id),me=null;
var DEF_AV='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23e5e7eb"/><circle cx="50" cy="38" r="18" fill="%239ca3af"/><path d="M15 92c6-22 24-34 35-34s29 12 35 34" fill="%239ca3af"/></svg>';
var DEF_CV='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="%23111827"/><stop offset="1" stop-color="%234f46e5"/></linearGradient></defs><rect width="600" height="180" fill="url(%23g)"/></svg>';
function msg(text,kind){$('profileMsg').textContent=text||'';$('profileMsg').className='msg '+(kind||'')}
function authMsg(text,kind){$('authMsg').textContent=text||'';$('authMsg').className='msg '+(kind||'')}
function showAuth(){ $('status').hidden=true;$('authView').hidden=false;$('profileView').hidden=true }
function showProfile(){ $('status').hidden=true;$('authView').hidden=true;$('profileView').hidden=false }
function fill(p){p=p||{};$('profileName').value=p.full_name||'';$('profileUsername').value=p.username||'';$('profileBio').value=p.bio||'';$('profileCountry').value=p.country||'';$('profileCity').value=p.city||'';$('profilePhone').value=p.phone_number||'';$('profileWebsite').value=p.website_url||'';$('profileOccupation').value=p.occupation||'';$('profileEducation').value=p.education||'';$('avatar').src=p.avatar_url||DEF_AV;$('avatarPreview').src=p.avatar_url||DEF_AV;$('cover').style.backgroundImage='url("'+(p.cover_url||DEF_CV)+'")';$('coverPreview').src=p.cover_url||DEF_CV;$('displayName').textContent=p.full_name||'Your Name';$('displayUsername').textContent='@'+(p.username||'username');$('displayBio').textContent=p.bio||'Tell people about yourself.';$('displayCountry').textContent=p.country||'—';$('displayCity').textContent=p.city||'—';$('displayPhone').textContent=p.phone_number||'—';$('displayWebsite').textContent=p.website_url||'—';$('displayOccupation').textContent=p.occupation||'—';$('displayEducation').textContent=p.education||'—'}
async function load(){var s=await db.auth.getSession();if(s.error){$('status').textContent=s.error.message;return}if(s.data.session){enter(s.data.session.user)}else showAuth();db.auth.onAuthStateChange(function(_e,session){if(session)enter(session.user)})}
async function enter(user){me=user;showProfile();var r=await db.from('profiles').select('full_name,username,avatar_url,cover_url,bio,website_url,country,city,phone_number,occupation,education').eq('id',user.id).maybeSingle();if(!r.data){var ins=await db.from('profiles').insert({id:user.id,full_name:user.user_metadata?.full_name||user.user_metadata?.name||'',username:'user_'+user.id.slice(0,8)}).select().single();if(ins.error){msg(ins.error.message,'err');return}r={data:ins.data}}fill(r.data)}
$('tabLogin').onclick=function(){$('tabLogin').classList.add('on');$('tabSignup').classList.remove('on');$('loginBox').hidden=false;$('signupBox').hidden=true;authMsg('')};$('tabSignup').onclick=function(){$('tabSignup').classList.add('on');$('tabLogin').classList.remove('on');$('loginBox').hidden=true;$('signupBox').hidden=false;authMsg('')};
$('googleBtn').onclick=async function(){var r=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});if(r.error)authMsg(r.error.message,'err')};
$('loginForm').onsubmit=async function(e){e.preventDefault();var r=await db.auth.signInWithPassword({email:$('lEmail').value,password:$('lPass').value});if(r.error)authMsg(r.error.message,'err');else authMsg('Logged in ✓','ok')};
$('signupForm').onsubmit=async function(e){e.preventDefault();var r=await db.auth.signUp({email:$('sEmail').value,password:$('sPass').value,options:{data:{full_name:$('sName').value.trim()}}});if(r.error)authMsg(r.error.message,'err');else authMsg('Account created. Check your email if verification is enabled.','ok')};
$('forgot').onclick=async function(){var email=$('lEmail').value.trim();if(!email){authMsg('Enter your email first.','err');return}var r=await db.auth.resetPasswordForEmail(email,{redirectTo:location.href});authMsg(r.error?r.error.message:'Password reset email sent.',''+(r.error?'err':'ok'))};
async function save(){var upd={full_name:$('profileName').value.trim(),username:$('profileUsername').value.trim()||null,bio:$('profileBio').value.trim(),country:$('profileCountry').value.trim(),city:$('profileCity').value.trim(),phone_number:$('profilePhone').value.trim(),website_url:$('profileWebsite').value.trim(),occupation:$('profileOccupation').value.trim(),education:$('profileEducation').value.trim()};var r=await db.from('profiles').update(upd).eq('id',me.id);if(r.error){msg(r.error.message,'err');return}fill(Object.assign({},upd,{avatar_url:$('avatar').src,cover_url:$('coverPreview').src}));msg('Profile saved ✓','ok')}
$('saveProfile').onclick=save;$('saveTop').onclick=save;$('logout').onclick=async function(){await db.auth.signOut();showAuth()};
async function upload(file,kind){if(!file)return;if(file.size>5*1024*1024){msg('Image must be under 5MB','err');return}var ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';var path='avatars/'+me.id+'/'+kind+'-'+Date.now()+'.'+ext;msg('Uploading...','');var up=await db.storage.from('product-media').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type||undefined});if(up.error){msg('Upload failed: '+up.error.message,'err');return}var url=db.storage.from('product-media').getPublicUrl(path).data.publicUrl;var field=kind==='avatar'?'avatar_url':'cover_url',obj={};obj[field]=url;var r=await db.from('profiles').update(obj).eq('id',me.id);if(r.error){msg(r.error.message,'err');return}if(kind==='avatar'){$('avatar').src=url;$('avatarPreview').src=url}else{$('cover').style.backgroundImage='url("'+url+'")';$('coverPreview').src=url}msg((kind==='avatar'?'Profile picture':'Cover picture')+' updated ✓','ok')}
$('avatarFile').onchange=e=>{upload(e.target.files[0],'avatar');e.target.value=''};$('coverFile').onchange=e=>{upload(e.target.files[0],'cover');e.target.value=''};
load();
})();
</script></body></html>
