<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PromptHub Seller</title><style>body{font-family:Inter,system-ui;background:#020817;color:#fff;margin:0}.wrap{max-width:1050px;margin:auto;padding:28px}.card{background:#081a36;border:1px solid #214675;border-radius:18px;padding:22px;margin-bottom:16px}.avatar{width:86px;height:86px;border-radius:50%;object-fit:cover;background:#17345c}.muted{color:#aab8d0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.item{border:1px solid #214675;border-radius:14px;padding:14px;background:#07162e}.item img,.item video{width:100%;max-height:180px;object-fit:contain;border-radius:10px;background:#020817}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="assets/theme.css"></head><body><div class="wrap"><a href="index.html">← Back to PromptHub</a><div id="seller" class="card">Loading seller…</div><h2>Published Prompts</h2><div id="products" class="grid"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/common.js"></script><script>(async()=>{var u=new URLSearchParams(location.search).get('username');if(!u){seller.textContent='Seller not found.';return}var r=await PH.db.rpc('get_public_seller',{p_username:u});var x=r.data&&r.data[0];if(r.error||!x){seller.textContent='Seller not found.';return}seller.innerHTML='<div style="display:flex;gap:18px;align-items:center"><img class="avatar" src="'+PH.esc(x.avatar_url||'')+'" onerror="this.style.display=\'none\'"><div><h1>'+PH.esc(x.full_name||x.username)+'</h1><div class="muted">@'+PH.esc(x.username)+'</div><p>'+PH.esc(x.bio||'')+'</p>'+(x.website_url?'<a href="'+PH.esc(x.website_url)+'" target="_blank" rel="noopener">Website</a>':'')+'</div></div>';var q=await PH.db.from('products').select('id,name,category,description,price,currency,is_free,image_url').eq('seller_id',x.id).eq('approval_status','approved').eq('active',true).order('created_at',{ascending:false});products.innerHTML=(q.data||[]).map(p=>'<a class="item" href="product.html?id='+p.id+'">'+(p.image_url?'<img src="'+PH.esc(p.image_url)+'">':'')+'<h3>'+PH.esc(p.name)+'</h3><div class="muted">'+PH.esc(p.category)+' · '+(p.is_free?'FREE':PH.esc(PH.money(p.price,p.currency)))+'</div><p class="muted">'+PH.esc(p.description||'')+'</p></a>').join('')||'<p class="muted">No published prompts yet.</p>'})()</script></body></html>
