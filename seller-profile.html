<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PromptHub Seller</title><style>body{font-family:Inter,system-ui;background:#020817;color:#fff;margin:0}.wrap{max-width:1050px;margin:auto;padding:0 0 28px}.back-link{display:inline-block;margin:18px 22px}.card{background:#081a36;border:1px solid #214675;border-radius:18px;padding:22px;margin:0 22px 16px}.cover-banner{width:100%;height:180px;object-fit:cover;background:#14172A;border-radius:0}.profile-head{padding:0 22px;margin-top:-46px;display:flex;gap:18px;align-items:flex-end}.avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;background:#17345c;border:4px solid #020817}.muted{color:#aab8d0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 22px}.item{border:1px solid #214675;border-radius:14px;padding:14px;background:#07162e}.item img,.item video{width:100%;max-height:180px;object-fit:contain;border-radius:10px;background:#020817}h2{padding:0 22px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="assets/theme.css"></head><body><div class="wrap">
<a class="back-link" href="index.html">← Back to PromptHub</a>
<img id="coverBanner" class="cover-banner" alt="">
<div id="profileHead" class="profile-head">Loading seller…</div>
<div id="bioCard" class="card" hidden></div>
<h2>Published Prompts</h2><div id="products" class="grid"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/common.js"></script><script>
(async()=>{
try{
if(PH.initError){profileHead.textContent='Could not start: '+PH.initError.message;return}
var DEFAULT_AVATAR='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%231B1F3B"/><circle cx="50" cy="38" r="18" fill="%232A2F52"/><path d="M15 92c6-22 24-34 35-34s29 12 35 34" fill="%232A2F52"/></svg>';
var DEFAULT_COVER='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160"><rect width="600" height="160" fill="%2314172A"/></svg>';
var u=new URLSearchParams(location.search).get('username');
if(!u){profileHead.textContent='Seller not found.';return}
var r=await PH.db.rpc('get_public_seller',{p_username:u});
var x=r.data&&r.data[0];
if(r.error||!x){profileHead.textContent='Seller not found.';return}
coverBanner.src=x.cover_url||DEFAULT_COVER;
profileHead.innerHTML='<img class="avatar" src="'+PH.esc(x.avatar_url||DEFAULT_AVATAR)+'" onerror="this.src=\''+DEFAULT_AVATAR+'\'"><div><h1 style="margin:0">'+PH.esc(x.full_name||x.username)+'</h1><div class="muted">@'+PH.esc(x.username)+'</div></div>';
if(x.bio||x.website_url){bioCard.hidden=false;bioCard.innerHTML='<p>'+PH.esc(x.bio||'')+'</p>'+(x.website_url?'<a href="'+PH.esc(x.website_url)+'" target="_blank" rel="noopener">Website</a>':'');}
var q=await PH.db.from('products').select('id,name,category,description,price,currency,is_free,image_url').eq('seller_id',x.id).eq('approval_status','approved').eq('active',true).order('created_at',{ascending:false});
products.innerHTML=(q.data||[]).map(p=>'<a class="item" href="product.html?id='+p.id+'">'+(p.image_url?'<img src="'+PH.esc(p.image_url)+'">':'')+'<h3>'+PH.esc(p.name)+'</h3><div class="muted">'+PH.esc(p.category)+' · '+(p.is_free?'FREE':PH.esc(PH.money(p.price,p.currency)))+'</div><p class="muted">'+PH.esc(p.description||'')+'</p></a>').join('')||'<p class="muted">No published prompts yet.</p>'
}catch(e){profileHead.textContent='Something went wrong: '+((e&&e.message)||String(e))}
})()
</script></body></html>
