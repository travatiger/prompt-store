<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="PromptHub Prompt Lab"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#020817"><title>Prompt Lab — PromptHub</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#020817;color:#f7f9ff;min-height:100vh}a{color:inherit;text-decoration:none}.nav{padding:16px 22px;border-bottom:1px solid #173968;background:#061329;display:flex;justify-content:space-between}.logo{font-size:22px;font-weight:900}.logo span{color:#8b45ff}.wrap{max-width:1050px;margin:auto;padding:24px}.hero{padding:28px;border:1px solid #274b83;border-radius:20px;background:linear-gradient(120deg,#081735,#091b40)}h1{font-size:42px;margin:0 0 8px}.muted{color:#aab8d0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tab{padding:10px 15px;border-radius:999px;border:1px solid #284873;background:#071733;color:#dbe7fb;font-weight:800;cursor:pointer}.tab.on{background:#5269ff}.panel{border:1px solid #1e416f;border-radius:16px;background:#07142b;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:750px){.grid{grid-template-columns:1fr}h1{font-size:32px}}textarea,input,select{width:100%;padding:12px;border:1px solid #31598e;background:#081a37;color:#fff;border-radius:10px;font:inherit}textarea{min-height:220px;resize:vertical}.btn{border:0;border-radius:10px;padding:11px 16px;background:linear-gradient(90deg,#5269ff,#713dff);color:#fff;font-weight:900;cursor:pointer;margin-top:10px}.result{margin-top:14px;background:#020b19;border:1px solid #284873;border-radius:12px;padding:14px;white-space:pre-wrap;word-break:break-word}.check{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.check button{padding:10px;border:1px solid #284873;background:#081a37;color:#fff;border-radius:9px;cursor:pointer}</style></head><body><nav class="nav"><a class="logo" href="index.html">Prompt<span>Hub</span></a><a href="account.html">My Account →</a></nav><main class="wrap"><section class="hero"><h1>✨ Prompt Lab</h1><p class="muted">Generate a structured starting prompt, enhance an existing prompt, or test your own prompt locally.</p></section><div class="tabs"><button class="tab on" data-tab="generate">🤖 Generator</button><button class="tab" data-tab="enhance">✨ Enhancer</button><button class="tab" data-tab="play">🧪 Playground</button></div><section id="generate" class="panel"><div class="grid"><div><label>What do you want to create?</label><textarea id="gIdea" placeholder="e.g. cinematic futuristic city at night"></textarea></div><div><label>Style / direction</label><textarea id="gStyle" placeholder="cinematic, premium, realistic"></textarea></div></div><button class="btn" id="gen">Generate Prompt</button><div id="gOut" class="result" hidden></div></section><section id="enhance" class="panel" hidden><label>Paste your prompt</label><textarea id="eIn" placeholder="Paste a prompt here..."></textarea><button class="btn" id="enh">Enhance Prompt</button><div id="eOut" class="result" hidden></div></section><section id="play" class="panel" hidden><label>Prompt</label><textarea id="pIn" placeholder="Write a prompt to test..."></textarea><div class="check"><button data-add="cinematic detail">+ Cinematic detail</button><button data-add="photorealistic detail">+ Photorealism</button><button data-add="professional composition">+ Composition</button><button data-add="high detail">+ High detail</button></div><button class="btn" id="copyPlay">Copy Prompt</button><div id="pOut" class="result">Your prompt will appear here.</div></section></main><script>const $=id=>document.getElementById(id);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');['generate','enhance','play'].forEach(x=>$(x).hidden=x!==b.dataset.tab)});$('gen').onclick=()=>{let idea=$('gIdea').value.trim(),style=$('gStyle').value.trim();if(!idea)return;$('gOut').hidden=false;$('gOut').textContent=`Create ${idea}. Style: ${style||'premium, polished, visually striking'}. Composition: strong subject focus, balanced framing, depth and clear visual hierarchy. Lighting: cinematic, controlled highlights and shadows. Quality: high detail, clean textures, professional finish.`};$('enh').onclick=()=>{let x=$('eIn').value.trim();if(!x)return;$('eOut').hidden=false;$('eOut').textContent=x+'\n\nEnhancement checklist: clear subject + action, specific environment, composition, lighting, style, camera/technical details, quality constraints, and unwanted elements to avoid.'};document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let v=$('pIn').value.trim();$('pIn').value=v+(v?'\n\n':'')+b.dataset.add;$('pOut').textContent=$('pIn').value});$('pIn').oninput=()=>$('pOut').textContent=$('pIn').value;$('copyPlay').onclick=async()=>{try{await navigator.clipboard.writeText($('pIn').value);$('copyPlay').textContent='Copied ✓';setTimeout(()=>$('copyPlay').textContent='Copy Prompt',1500)}catch(e){}};</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
