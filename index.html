<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Prompt Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 30px 20px;
        }

        .hero {
            background: white;
            padding: 40px 20px;
            text-align: center;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .product {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .product h2 {
            margin-top: 0;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            margin: 15px 0;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
        }
    </style>
</head>

<body>

<header>
    <h2>My Prompt Store</h2>
</header>

<div class="container">

    <section class="hero">
        <h1>Premium AI Prompts</h1>
        <p>Discover powerful prompts for AI image, video and content creation.</p>
    </section>

    <section class="products">

        <div class="product">
            <h2>Master Image Prompt</h2>
            <p>Create amazing AI images with this powerful prompt.</p>

            <div class="price">$5</div>

            <button>View Prompt</button>
        </div>

        <div class="product">
            <h2>YouTube Master Prompt</h2>
            <p>Create better YouTube content with AI.</p>

            <div class="price">$3</div>

            <button>View Prompt</button>
        </div>

    </section>

</div>

</body>
  </html>
