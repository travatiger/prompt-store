<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>People — PromptHub</title>
<link rel="manifest" href="manifest.webmanifest">
<script>(function(){try{var t=localStorage.getItem('ph-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a class="logo" href="account.html" id="navLogo"></a>
    <div class="nav-right">
      <a class="back" href="prompts.html">Prompts</a>
      <div id="phSearchMount"></div>
      <div id="phMsgMount"></div>
      <div id="phNotifMount"></div>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle dark mode">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
    </div>
  </div>
</nav>

<main class="container">
  <div class="page-head">
    <div>
      <h1>People</h1>
      <p>Everyone using PromptHub.</p>
    </div>
  </div>
  <div class="card status" id="status">Loading…</div>
  <div class="card" id="listCard" style="padding:8px;display:flex;flex-direction:column;gap:2px" hidden></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/common.js"></script>
<script>
(function(){'use strict';
var PH=window.PH,db=PH.db,$=id=>document.getElementById(id),esc=PH.esc,me=null,myFollowingSet=new Set(),myBlockedSet=new Set();
var DEF_AV='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23e5e5e5"/><circle cx="50" cy="38" r="18" fill="%23a0a0a0"/><path d="M15 92c6-22 24-34 35-34s29 12 35 34" fill="%23a0a0a0"/></svg>';

PH.bindThemeToggle('themeBtn');
PH.mountSearch('phSearchMount');
PH.mountLogo('navLogo');
PH.mountMessages('phMsgMount');
PH.mountNotifications('phNotifMount');

async function init(){
  var ok=await PH.requireCompleteProfile();
  if(!ok)return;
  var s=await db.auth.getSession();
  me=s.data&&s.data.session?s.data.session.user:null;

  if(me){
    var mf=await db.from('follows').select('following_id').eq('follower_id',me.id);
    myFollowingSet=new Set((mf.data||[]).map(function(x){return x.following_id}));
    myBlockedSet=await PH.getBlockedSet(me.id);
  }

  var r=await db.from('profiles').select('id,full_name,username,avatar_url,is_verified').order('created_at',{ascending:false});
  var list=r.error?[]:(r.data||[]);
  $('status').hidden=true;
  if(!list.length){$('status').hidden=false;$('status').textContent='No one has joined yet.';return}
  $('listCard').hidden=false;
  $('listCard').innerHTML=list.map(personRowHtml).join('');
}

function personRowHtml(u){
  var avatar=u.avatar_url||DEF_AV;
  var isMe=me&&me.id===u.id;
  var following=myFollowingSet.has(u.id);
  var blocked=myBlockedSet.has(u.id);
  var action='';
  if(!isMe&&me){
    action='<button class="btn'+(following?'':' primary')+'" data-toggle-follow="'+esc(u.id)+'" type="button">'+(following?'Following':'Follow')+'</button>'+
      '<button class="btn" data-toggle-block="'+esc(u.id)+'" type="button" title="'+(blocked?'Unblock':'Block')+'">'+(blocked?'Unblock':'🚫')+'</button>';
  }else if(isMe)action='<span class="msg" style="padding:6px 12px">You</span>';
  return '<div class="person-row"'+(blocked?' style="opacity:.55"':'')+'>'+
    '<a href="profile.html?u='+esc(u.id)+'" style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-decoration:none;color:inherit">'+
    '<img src="'+esc(avatar)+'" alt="">'+
    '<div class="info"><b>'+esc(u.full_name||'User')+PH.verifiedBadge(u.is_verified)+'</b><span>'+(u.username?'@'+esc(u.username):'')+'</span></div>'+
    '</a>'+action+
    '</div>';
}

$('listCard').addEventListener('click',async function(e){
  var b=e.target.closest('[data-toggle-follow]');
  var bl=e.target.closest('[data-toggle-block]');
  if(!b&&!bl)return;
  if(!me){location.href='account.html';return}
  if(b){
    var uid=b.getAttribute('data-toggle-follow');
    var already=myFollowingSet.has(uid);
    b.disabled=true;
    if(already){
      var r=await db.from('follows').delete().eq('follower_id',me.id).eq('following_id',uid);
      if(!r.error)myFollowingSet.delete(uid);
    }else{
      var r2=await db.from('follows').insert({follower_id:me.id,following_id:uid});
      if(!r2.error)myFollowingSet.add(uid);
    }
    b.textContent=myFollowingSet.has(uid)?'Following':'Follow';
    b.classList.toggle('primary',!myFollowingSet.has(uid));
    b.disabled=false;
  }
  if(bl){
    var uid2=bl.getAttribute('data-toggle-block');
    var wasBlocked=myBlockedSet.has(uid2);
    bl.disabled=true;
    if(wasBlocked){
      var r3=await db.from('user_blocks').delete().eq('blocker_id',me.id).eq('blocked_id',uid2);
      if(!r3.error)myBlockedSet.delete(uid2);
    }else{
      if(!confirm('Block this person? Their prompts will stop showing up in your feed.')){bl.disabled=false;return}
      var r4=await db.from('user_blocks').insert({blocker_id:me.id,blocked_id:uid2});
      if(!r4.error)myBlockedSet.add(uid2);
    }
    init();
  }
});

init();
})();
</script>
</body>
</html>
