<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt — PromptHub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#f7f7fb;color:#17171c;line-height:1.5}
a{text-decoration:none;color:inherit}.nav{background:#fff;border-bottom:1px solid #e9e9ef}.nav-inner{max-width:950px;margin:auto;padding:16px 20px;display:flex;align-items:center;gap:20px}.logo{font-size:22px;font-weight:800;margin-right:auto}.logo span{font-weight:400}.btn{border:0;border-radius:10px;padding:11px 17px;background:#17171c;color:#fff;font-weight:700;cursor:pointer;display:inline-block}.wrap{max-width:850px;margin:45px auto;padding:0 20px}.back{display:inline-block;margin-bottom:20px;color:#666}.box{background:#fff;border:1px solid #e7e7ed;border-radius:20px;padding:30px}.icon{height:150px;border-radius:15px;background:#eeeef4;display:flex;align-items:center;justify-content:center;font-size:58px;margin-bottom:25px}.product-image,.product-video{display:block;width:100%;max-height:520px;object-fit:contain;background:#111;border-radius:15px;margin-bottom:20px}.badge{font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.7px}.title{font-size:clamp(30px,6vw,48px);margin:7px 0 12px}.desc{color:#666;font-size:16px;margin-bottom:25px}.price{font-size:24px;font-weight:800;margin-bottom:20px}.notice{background:#fff;border:1px dashed #d5d5df;border-radius:15px;padding:25px;text-align:center;color:#555}.error{color:#a22}.actions{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<nav class="nav"><div class="nav-inner">
<a class="logo" href="index.html">Prompt<span>Hub</span></a>
<a class="btn" href="account.html">Account</a>
</div></nav>
<main class="wrap">
<a class="back" href="index.html">← Back to prompts</a>
<div id="status" class="notice">Loading prompt…</div>
<div id="content" hidden></div>
</main>
<script>
(function(){
'use strict';
var URL='https://bwtblyvnsiguhopmxggi.supabase.co';
var KEY='sb_publishable_BKBleSWgGlggg-MPaBBBcg_zTObBTW8';
var cats={image:{label:'AI Images',icon:'🖼️'},video:{label:'AI Video',icon:'🎬'},youtube:{label:'YouTube',icon:'▶️'},business:{label:'Business',icon:'💼'}};
var status=document.getElementById('status'), content=document.getElementById('content');
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]})}
function money(n,c){try{return new Intl.NumberFormat('en-US',{style:'currency',currency:c||'USD',minimumFractionDigits:Number(n)%1===0?0:2}).format(Number(n))}catch(e){return n+' '+(c||'')}}
function showError(e){status.innerHTML='<strong>Could not load this prompt.</strong><div style="margin-top:8px">'+esc(e)+'</div><div style="margin-top:15px"><a class="btn" href="index.html">Back to store</a></div>'}
async function load(){
 var id=new URLSearchParams(location.search).get('id');
 if(!id || !/^\d+$/.test(id)){showError('A valid prompt ID is missing.');return}
 try{
  var u=URL+'/rest/v1/products?select=id,name,category,description,price,currency,image_url,video_url,active&id=eq.'+encodeURIComponent(id)+'&active=eq.true';
  var r=await fetch(u,{headers:{apikey:KEY,Accept:'application/json'},cache:'no-store'});
  var t=await r.text(); if(!r.ok) throw new Error('Database returned HTTP '+r.status+(t?': '+t.slice(0,250):''));
  var rows=JSON.parse(t); if(!rows.length) throw new Error('This prompt was not found.');
  var p=rows[0], c=cats[p.category]||{label:p.category||'Other',icon:'📦'};
  status.hidden=true;
  content.hidden=false;
  var media='';
  if(p.image_url) media += '<img class="product-image" src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'">';
  if(p.video_url) media += '<video class="product-video" src="'+esc(p.video_url)+'" controls preload="metadata"></video>';
  if(!media) media='<div class="icon">'+c.icon+'</div>';
  content.innerHTML='<div class="box">'+media+'<div class="badge">'+esc(c.label)+'</div><h1 class="title">'+esc(p.name)+'</h1><p class="desc">'+esc(p.description||'')+'</p><div class="price">'+esc(money(p.price,p.currency))+'</div><div class="actions"><button class="btn" id="buy">Get this prompt</button><a class="btn" href="account.html">Account</a></div></div>';
  document.getElementById('buy').onclick=function(){location.href='account.html?prompt='+encodeURIComponent(p.id)};
 }catch(e){console.error(e);showError(e.message||String(e))}
}
load();
})();
</script>
</body>
</html>
