<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Product — PromptHub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f7f7fb;color:#17171c;line-height:1.6}
a{text-decoration:none;color:inherit}
.nav{background:#fff;border-bottom:1px solid #e8e8ee;padding:17px 20px}
.nav-inner{max-width:1050px;margin:auto;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:22px;font-weight:800}.logo span{font-weight:400}
.back{color:#555;font-size:14px}
.container{max-width:900px;margin:45px auto;padding:0 20px}
.product{background:#fff;border:1px solid #e4e4eb;border-radius:22px;padding:35px}
.top{display:flex;gap:30px;align-items:center;margin-bottom:30px}
.visual{width:210px;height:180px;background:#eeeef4;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:65px;flex-shrink:0}
.category{font-size:12px;color:#777;text-transform:uppercase;letter-spacing:1px}
h1{font-size:38px;line-height:1.15;margin:7px 0}
.description{color:#666;margin:12px 0 15px}
.price{font-size:26px;font-weight:800}
.prompt-box{margin-top:10px;background:#17171c;color:white;border-radius:17px;padding:23px}
.prompt-box h2{font-size:18px;margin-bottom:13px}
#promptText{background:#292930;color:#ddd;border-radius:10px;padding:18px;font-size:14px;white-space:pre-wrap}
.copy{margin-top:15px;border:0;border-radius:9px;padding:12px 18px;background:#fff;color:#17171c;font-weight:800;cursor:pointer}
#message{margin-left:10px;color:#aaa;font-size:13px}
.note{margin-top:20px;color:#777;font-size:13px}
@media(max-width:650px){.top{flex-direction:column;align-items:flex-start}.visual{width:100%;height:150px}h1{font-size:30px}.product{padding:23px}}
</style>
</head>
<body>
<nav class="nav">
<div class="nav-inner">
<a class="logo" href="index.html">Prompt<span>Hub</span></a>
<a class="back" href="index.html">← Back to Store</a>
</div>
</nav>

<main class="container">
<section class="product">
<div class="top">
<div class="visual" id="visual">🖼️</div>
<div>
<div class="category" id="category">AI Images</div>
<h1 id="title">Master Image Prompt</h1>
<p class="description" id="description">Create detailed, high-quality AI images with a reusable master prompt.</p>
<div class="price" id="price">$5</div>
</div>
</div>

<div class="prompt-box">
<h2>MASTER PROMPT</h2>
<div id="promptText"></div>
<button class="copy" onclick="copyPrompt()">📋 Copy Prompt</button>
<span id="message"></span>
</div>

<p class="note">This is a demo product page. Payment and protected downloads can be added later.</p>
</section>
</main>

<script>
const products={
image:{
title:"Master Image Prompt",category:"AI Images",price:"$5",icon:"🖼️",
description:"Create detailed, high-quality AI images with a reusable master prompt.",
prompt:`Create a high-quality, detailed AI image based on the following concept.

Describe the subject, environment, lighting, composition, camera perspective, colors, atmosphere and visual style in detail.

Make the final result cinematic, realistic, visually compelling and professionally composed.`
},
youtube:{
title:"YouTube Master Prompt",category:"YouTube",price:"$3",icon:"▶️",
description:"Generate video ideas, titles, scripts and content workflows with AI.",
prompt:`Act as an expert YouTube content strategist.

Create a complete video concept including a strong topic, clickable title ideas, an engaging structure, a clear script outline, audience hook and call to action.

Keep the content useful, original and easy to understand.`
},
video:{
title:"AI Video Prompt",category:"AI Video",price:"$4",icon:"🎬",
description:"Build structured prompts for cinematic AI video generation.",
prompt:`Create a cinematic AI video prompt.

Describe the subject, setting, action, camera movement, lens, lighting, atmosphere, composition and visual style.

Keep the scene coherent and detailed, with realistic motion and a professional cinematic look.`
},
business:{
title:"Business Master Prompt",category:"Business",price:"$6",icon:"💼",
description:"Organize ideas, research and marketing tasks with a powerful AI workflow.",
prompt:`Act as a practical business strategy assistant.

Analyze the provided business idea, identify the target audience, clarify the value proposition, suggest marketing angles, content ideas and actionable next steps.

Present the result clearly with useful sections and practical recommendations.`
}
};

const key=new URLSearchParams(location.search).get("product")||"image";
const p=products[key]||products.image;

document.title=p.title+" — PromptHub";
document.getElementById("visual").textContent=p.icon;
document.getElementById("category").textContent=p.category;
document.getElementById("title").textContent=p.title;
document.getElementById("description").textContent=p.description;
document.getElementById("price").textContent=p.price;
document.getElementById("promptText").textContent=p.prompt;

function copyPrompt(){
navigator.clipboard.writeText(p.prompt).then(()=>{
document.getElementById("message").textContent="Copied! ✓";
setTimeout(()=>document.getElementById("message").textContent="",1800);
}).catch(()=>{
document.getElementById("message").textContent="Please copy manually.";
});
}
</script>
</body>
</html>
